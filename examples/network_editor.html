<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Síťový editor – PoC</title>

    <link rel="stylesheet" type="text/css" href="../build/potree/potree.css">
    <link rel="stylesheet" type="text/css" href="../libs/jquery-ui/jquery-ui.min.css">
    <link rel="stylesheet" type="text/css" href="../libs/openlayers3/ol.css">
    <link rel="stylesheet" type="text/css" href="../libs/spectrum/spectrum.css">
    <link rel="stylesheet" type="text/css" href="../libs/jstree/themes/mixed/style.css">
    <link rel="stylesheet" type="text/css" href="../libs/Cesium/Widgets/CesiumWidget/CesiumWidget.css">
    <style>
        #network_info_panel {
            display: none;
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 10000;
            width: 340px;
            max-height: calc(100% - 40px);
            overflow-y: auto;
            padding: 10px 12px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.8);
            color: #ffffff;
            font: 12px/1.4 Arial, sans-serif;
        }
        #network_info_panel .network-info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-weight: bold;
        }
        #network_info_panel .network-info-close {
            border: none;
            background: none;
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
        }
        #network_info_panel .network-info-feature {
            padding: 6px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }
        #network_info_panel .network-info-title {
            margin-bottom: 2px;
            color: #ffcc66;
            font-weight: bold;
        }
        #network_info_panel table {
            width: 100%;
            border-collapse: collapse;
        }
        #network_info_panel td {
            padding: 1px 4px 1px 0;
            vertical-align: top;
        }
        #network_info_panel td:first-child {
            width: 45%;
            color: #aab4be;
        }
        #network_info_panel .network-info-footer {
            margin-top: 6px;
            color: #aab4be;
            font-size: 11px;
        }
        .network-editor-status {
            margin-left: 4px;
            color: #aab4be;
        }
        .network-editor-note {
            color: #aab4be;
            font-size: 11px;
        }
        .network-editor-active {
            outline: 2px solid #ffcc66;
        }
        .network-editor-field {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .network-editor-field input[type=text] {
            flex: 1;
        }
        .network-editor-layer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .network-editor-feature-group {
            margin-top: 4px;
            font-weight: bold;
        }
        .network-editor-feature {
            display: flex;
            align-items: baseline;
            gap: 6px;
            padding: 2px 4px;
            cursor: pointer;
        }
        .network-editor-feature:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .network-editor-swatch {
            flex: none;
            width: 10px;
            height: 10px;
            border-radius: 2px;
        }
    </style>
</head>

<body>
    <script src="../libs/jquery/jquery-3.1.1.min.js"></script>
    <script src="../libs/spectrum/spectrum.js"></script>
    <script src="../libs/jquery-ui/jquery-ui.min.js"></script>
    <script src="../libs/other/BinaryHeap.js"></script>
    <script src="../libs/tween/tween.min.js"></script>
    <script src="../libs/d3/d3.js"></script>
    <script src="../libs/proj4/proj4.js"></script>
    <script src="../libs/openlayers3/ol.js"></script>
    <script src="../libs/i18next/i18next.js"></script>
    <script src="../libs/jstree/jstree.js"></script>
    <script src="../build/potree/potree.js"></script>
    <script src="../libs/plasio/js/laslaz.js"></script>
    <script src="../libs/Cesium/Cesium.js"></script>
    <script src="../libs/copc/index.js"></script>

    <div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px;">
        <div id="potree_render_area" style="background-image: url('../build/potree/resources/images/background.jpg');">
            <div id="cesiumContainer" style="position: absolute; inset: 0; background-color: #102030"></div>
        </div>
        <div id="potree_sidebar_container"></div>
    </div>

    <div id="network_info_panel">
        <div class="network-info-header">
            <span>Info o síti</span>
            <button class="network-info-close" type="button" title="Zavřít">×</button>
        </div>
        <div class="network-info-body"></div>
        <div class="network-info-footer">Zdroj: ČÚZK – IS DMVS (DTM krajů). Přibližný zákres, pouze orientačně.</div>
    </div>

    <script type="module">
        const defaultDatasetName = "litovel";
        const requestedDatasetName = new URLSearchParams(window.location.search).get("data") ?? "";
        const datasetName = requestedDatasetName.replace(/[^a-zA-Z0-9_-]/g, "") || defaultDatasetName;

        const litovelCentreBookmark = {
            title: "Litovel – centrum",
            position: [-558516, -1108474, 850],
            target: [-558516, -1108324, 250]
        };

        const dtmPropertyLabels = {
            nazevvlastnika: "Vlastník",
            nazevspravce: "Správce",
            nazevprovozovatele: "Provozovatel",
            urovenumisteniobjektuti: "Úroveň umístění",
            tridapresnostipoloha: "Třída přesnosti polohy",
            tridapresnostivyska: "Třída přesnosti výšky",
            zpusobporizeniti: "Způsob pořízení",
            maximalninapetovahladina: "Napěťová hladina",
            doplnek: "Doplněk",
            datumvkladu: "Datum vkladu",
            datumzmeny: "Datum změny",
            neuplnadata: "Neúplná data"
        };

        const viewer = new Potree.Viewer(document.getElementById("potree_render_area"), {
            cesiumRenderArea: document.getElementById("cesiumContainer")
        });
        window.viewer = viewer;
        viewer.setEDLEnabled(true);
        viewer.setFOV(60);
        viewer.setPointBudget(5_000_000);
        viewer.setMinNodeSize(30);
        viewer.setBackground(null);
        viewer.useHQ = true;

        const mapPlane = new Potree.NetworkEditor.MapPlane(viewer);
        const dtmOverlay = new Potree.NetworkEditor.DtmOverlay(viewer, mapPlane);
        const surfacePicker = new Potree.NetworkEditor.SurfacePicker(viewer, mapPlane);
        const cadastreOverlay = new Potree.NetworkEditor.CadastreOverlay(viewer, mapPlane);
        const dtmInfoTool = new Potree.NetworkEditor.DtmInfoTool(viewer, mapPlane, dtmOverlay);
        const cadDocument = new Potree.NetworkEditor.CadDocument();
        const cadView = new Potree.NetworkEditor.CadView(viewer, cadDocument);
        const cadSnapper = new Potree.NetworkEditor.CadSnapper(viewer, mapPlane, cadDocument, cadastreOverlay);
        surfacePicker.setSnapper(cadSnapper);
        const cadTool = new Potree.NetworkEditor.CadTool(viewer, surfacePicker, cadDocument, cadView);
        const cadEditTool = new Potree.NetworkEditor.CadEditTool(viewer, cadDocument, surfacePicker);
        const cadHistory = new Potree.NetworkEditor.CadHistory(cadDocument);
        const featureProfile = new Potree.NetworkEditor.FeatureProfile(viewer);
        cadDocument.addLayer("Vrstva 1");

        const maximumDrawingFileBytes = 20 * 1024 * 1024;
        const drawingFileErrorMessages = {
            [Potree.NetworkEditor.CadFileErrorCode.TOO_LARGE]: "Soubor je příliš velký (max. 20 MB).",
            [Potree.NetworkEditor.CadFileErrorCode.INVALID_JSON]: "Soubor není platný JSON.",
            [Potree.NetworkEditor.CadFileErrorCode.UNSUPPORTED_FORMAT]: "Soubor není kresba síťového editoru, nebo má jinou verzi či souřadnicový systém.",
            [Potree.NetworkEditor.CadFileErrorCode.INVALID_CONTENT]: "Kresba obsahuje neplatná data."
        };
        const flyToMinimumDistanceMetres = 40;
        const flyToMaximumPitch = -Math.PI / 4;
        const flyToDurationMilliseconds = 800;
        const featureViewRenderers = [];
        let isFeatureViewRenderScheduled = false;

        const cadastreExtentMetres = 1500;
        const cadastreLayers = [
            { layerId: Potree.NetworkEditor.CadastreLayer.PARCELS, title: "Parcely" },
            { layerId: Potree.NetworkEditor.CadastreLayer.BUILDINGS, title: "Budovy" },
            { layerId: Potree.NetworkEditor.CadastreLayer.ROADS, title: "Cesty (ZABAGED)" }
        ];
        const loadedCadastreLayers = new Set();

        const drawingIdleHint = "Vyber typ prvku a klikej do mapy. Kliknutím na nakreslený prvek ho vybereš. "
            + "Tažením myši otáčíš a posouváš pohled. Žlutý čtvereček ukazuje přichycení k vrcholu nebo hraně. "
            + "Ctrl+Z vrátí poslední změnu.";
        const selectionHint = "Vybraný prvek: tažením vrcholu ho posuneš, kliknutím na hranu přidáš vrchol, "
            + "kliknutím na vrchol ho vybereš. Delete smaže vybraný vrchol, jinak celý prvek. Esc zruší výběr. "
            + "Popisek a barva se teď mění u vybraného prvku.";
        const vertexDeleteRefusedHint = "Vrchol nejde smazat: linie potřebuje aspoň 2 vrcholy a polygon 3. "
            + "Celý prvek smažeš, když vrchol odznačíš a stiskneš Delete.";
        const drawingTypes = [
            {
                featureType: Potree.NetworkEditor.CadFeatureType.POINT,
                title: "Bod",
                hint: "Každým kliknutím vložíš bod. Esc kreslení ukončí."
            },
            {
                featureType: Potree.NetworkEditor.CadFeatureType.POLYLINE,
                title: "Linie",
                hint: "Kliknutím přidáš vrchol, Backspace vrátí poslední, Esc linii dokončí."
            },
            {
                featureType: Potree.NetworkEditor.CadFeatureType.POLYGON,
                title: "Polygon",
                hint: "Kliknutím přidáš vrchol, Backspace vrátí poslední. Polygon uzavřeš kliknutím na první vrchol nebo Esc."
            }
        ];

        const infoPanel = $("#network_info_panel");
        const infoPanelBody = infoPanel.find(".network-info-body");
        let isInfoPromptShown = false;

        function loadPointCloud(name) {
            return new Promise((resolve) => {
                Potree.loadPointCloud(`./data/${name}/ept/ept.json`, name, (event) => resolve(event.pointcloud));
            });
        }

        function addPointCloud(pointCloud) {
            const material = pointCloud.material;
            const pointCloudCheckbox = $("#network_editor_point_cloud");
            material.activeAttributeName = "rgba";
            material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
            material.size = 1;
            material.minSize = 2;
            pointCloud.visible = pointCloudCheckbox.prop("checked");
            pointCloud.addEventListener("visibility_changed", () => pointCloudCheckbox.prop("checked", pointCloud.visible));
            viewer.scene.addPointCloud(pointCloud);
            viewer.fitToScreen();
        }

        function setPointCloudsVisible(visible) {
            for (const pointCloud of viewer.scene.pointclouds) {
                pointCloud.visible = visible;
            }
        }

        function showOrthophotoMap() {
            viewer.cesiumRender.init();
            viewer.setShowCesium(true);
            $("#show_cesium_map_provider input[value=orto]").prop("checked", true).trigger("change");
        }

        function formatPropertyValue(value) {
            if (typeof value === "boolean") {
                return value ? "ano" : "ne";
            }
            return String(value);
        }

        function createFeatureElement(properties) {
            const title = $("<div class=\"network-info-title\"></div>").text(properties.objektovytypnazev ?? "Objekt DTM");
            const table = $("<table></table>");
            for (const [key, label] of Object.entries(dtmPropertyLabels)) {
                const value = properties[key];
                if (value === null || value === undefined || value === "") {
                    continue;
                }
                table.append($("<tr></tr>").append($("<td></td>").text(label), $("<td></td>").text(formatPropertyValue(value))));
            }
            return $("<div class=\"network-info-feature\"></div>").append(title, table);
        }

        function showInfoMessage(message) {
            infoPanelBody.empty().append($("<div></div>").text(message));
            infoPanel.show();
        }

        function showInfoResult(result) {
            if (result.features.length === 0) {
                showInfoMessage("V místě kliknutí není žádná síť.");
                return;
            }
            infoPanelBody.empty();
            if (result.region) {
                infoPanelBody.append($("<div class=\"network-editor-note\"></div>").text(`DTM: ${result.region}`));
            }
            for (const properties of result.features) {
                infoPanelBody.append(createFeatureElement(properties));
            }
            infoPanel.show();
        }

        function closeInfoPanel() {
            isInfoPromptShown = false;
            infoPanel.hide();
            dtmInfoTool.clearMarker();
        }

        function createBookmarkButton(bookmark) {
            return $("<input type=\"button\">")
                .val(bookmark.title)
                .on("click", () => viewer.scene.view.setView(bookmark.position, bookmark.target, 1000));
        }

        function createCheckboxItem(identifier, text, checked, onChange) {
            const checkbox = $("<input type=\"checkbox\">")
                .attr("id", identifier)
                .prop("checked", checked)
                .on("change", (event) => onChange(event.target.checked));
            const label = $("<label></label>").attr("for", identifier).text(text);
            return $("<li></li>").append(checkbox, label);
        }

        function createDtmLayerItem() {
            const status = $("<span class=\"network-editor-status\"></span>");
            dtmOverlay.addEventListener("loading_changed", (event) => status.text(event.loading ? "načítám…" : ""));
            dtmOverlay.addEventListener("load_failed", () => status.text("nepodařilo se načíst"));
            return createCheckboxItem("network_editor_dtm", "DTM – technická infrastruktura", true, (checked) => dtmOverlay.setVisible(checked))
                .append(status);
        }

        function createInfoToolButton() {
            const button = $("<input type=\"button\">").val("Info o síti");
            button.on("click", () => {
                if (dtmInfoTool.active) {
                    dtmInfoTool.deactivate();
                } else {
                    dtmInfoTool.activate();
                }
            });
            dtmInfoTool.addEventListener("activation_changed", (event) => {
                button.val(event.active ? "Info o síti: zapnuto (Esc vypne)" : "Info o síti");
                if (event.active) {
                    showInfoMessage("Klikni na síť v mapě.");
                    isInfoPromptShown = true;
                } else if (isInfoPromptShown) {
                    closeInfoPanel();
                }
            });
            return button;
        }

        function createDrawingButtonsItem() {
            const item = $("<li></li>");
            for (const drawingType of drawingTypes) {
                const button = $("<input type=\"button\">").val(drawingType.title);
                button.on("click", () => {
                    if (cadTool.drawingType === drawingType.featureType) {
                        cadTool.finishDrawing();
                    } else {
                        cadTool.startDrawing(drawingType.featureType);
                    }
                });
                cadTool.addEventListener("drawing_changed", (event) => {
                    button.toggleClass("network-editor-active", event.drawingType === drawingType.featureType);
                });
                item.append(button);
            }
            return item;
        }

        function applyStyle(style) {
            if (cadEditTool.selectedFeature) {
                cadEditTool.updateSelectedFeature(style);
                scheduleFeatureViewRender();
            } else {
                cadTool.setStyle(style);
            }
        }

        function captureSelectedFeatureChange() {
            if (cadEditTool.selectedFeature) {
                cadHistory.capture();
            }
        }

        function createStyleItems() {
            const labelInput = $("<input type=\"text\" id=\"network_editor_label\" placeholder=\"např. Kabel NN\">")
                .on("input", (event) => applyStyle({ label: event.target.value }))
                .on("change", captureSelectedFeatureChange);
            const colorInput = $("<input type=\"color\" id=\"network_editor_color\">")
                .val(cadTool.style.color)
                .on("input", (event) => applyStyle({ color: event.target.value }))
                .on("change", captureSelectedFeatureChange);
            cadEditTool.addEventListener("selection_changed", (event) => {
                const feature = event.feature;
                labelInput.val(feature ? feature.label : cadTool.style.label);
                colorInput.val(feature ? `#${feature.color.getHexString()}` : cadTool.style.color);
            });
            return [
                $("<li class=\"network-editor-field\"></li>").append($("<label for=\"network_editor_label\">Popisek</label>"), labelInput),
                $("<li class=\"network-editor-field\"></li>").append($("<label for=\"network_editor_color\">Barva</label>"), colorInput)
            ];
        }

        function createDrawingHintItem() {
            const hint = $("<li class=\"network-editor-note\"></li>").text(drawingIdleHint);
            const updateHint = () => {
                const activeDrawingType = drawingTypes.find((drawingType) => drawingType.featureType === cadTool.drawingType);
                if (activeDrawingType) {
                    hint.text(activeDrawingType.hint);
                } else {
                    hint.text(cadEditTool.selectedFeature ? selectionHint : drawingIdleHint);
                }
            };
            cadTool.addEventListener("drawing_changed", updateHint);
            cadEditTool.addEventListener("selection_changed", updateHint);
            cadEditTool.addEventListener("vertex_delete_refused", () => hint.text(vertexDeleteRefusedHint));
            return hint;
        }

        function createUndoItem() {
            const undoButton = $("<input type=\"button\">")
                .val("Zpět (Ctrl+Z)")
                .prop("disabled", !cadHistory.canUndo)
                .on("click", () => cadHistory.undo());
            cadHistory.addEventListener("history_changed", () => undoButton.prop("disabled", !cadHistory.canUndo));
            return $("<li></li>").append(undoButton);
        }

        function isTextEditingTarget(event) {
            return event.target.isContentEditable
                || $(event.target).is("textarea, input:not([type=button], [type=checkbox], [type=radio], [type=color], [type=range])");
        }

        function onUndoShortcut(event) {
            const isUndoShortcut = (event.ctrlKey || event.metaKey) && !event.shiftKey && !event.altKey && event.key.toLowerCase() === "z";
            if (!isUndoShortcut || isTextEditingTarget(event) || cadTool.isDrawing || viewer.cubatureTool.anyInsertionActive()) {
                return;
            }
            event.preventDefault();
            cadHistory.undo();
        }

        function createFeatureCountItem() {
            const featureCount = $("<li class=\"network-editor-note\"></li>").text("Nakreslené prvky: 0");
            const updateFeatureCount = () => featureCount.text(`Nakreslené prvky: ${cadDocument.features.length}`);
            cadDocument.addEventListener("feature_added", updateFeatureCount);
            cadDocument.addEventListener("feature_removed", updateFeatureCount);
            return featureCount;
        }

        function createLayerRow(layer) {
            const activeRadio = $("<input type=\"radio\" name=\"network_editor_active_layer\">")
                .prop("checked", layer.id === cadDocument.activeLayerId)
                .on("change", () => cadDocument.setActiveLayer(layer.id));
            const visibleCheckbox = $("<input type=\"checkbox\">")
                .prop("checked", layer.visible)
                .on("change", (event) => cadDocument.setLayerVisible(layer.id, event.target.checked));
            return $("<div class=\"network-editor-layer\"></div>").append(
                $("<label></label>").append(activeRadio, $("<span></span>").text(` ${layer.name}`)),
                $("<label></label>").append(visibleCheckbox, $("<span></span>").text(" zobrazit"))
            );
        }

        function createLayerItems() {
            const layerList = $("<li></li>");
            const renderLayers = () => layerList.empty().append(cadDocument.layers.map(createLayerRow));
            cadDocument.addEventListener("layers_changed", renderLayers);
            renderLayers();
            const addLayerButton = $("<input type=\"button\">")
                .val("Přidat vrstvu")
                .on("click", () => cadDocument.addLayer(`Vrstva ${cadDocument.layers.length + 1}`));
            return [
                layerList,
                $("<li></li>").append(addLayerButton),
                $("<li class=\"network-editor-note\"></li>").text("Nové prvky se kreslí do vybrané vrstvy.")
            ];
        }

        function scheduleFeatureViewRender() {
            if (isFeatureViewRenderScheduled) {
                return;
            }
            isFeatureViewRenderScheduled = true;
            queueMicrotask(() => {
                isFeatureViewRenderScheduled = false;
                featureViewRenderers.forEach((render) => render());
            });
        }

        function formatNumber(value, fractionDigits) {
            return value.toLocaleString("cs-CZ", { minimumFractionDigits: fractionDigits, maximumFractionDigits: fractionDigits });
        }

        function describeFeature(feature) {
            const typeTitle = drawingTypes.find((drawingType) => drawingType.featureType === feature.featureType).title;
            return feature.label !== "" ? `${typeTitle} „${feature.label}“` : typeTitle;
        }

        function describeFeatureMeasurement(feature) {
            if (feature.featureType === Potree.NetworkEditor.CadFeatureType.POLYLINE) {
                return `délka ${formatNumber(feature.computeHorizontalLength(), 2)} m (šikmo ${formatNumber(feature.computeSlopeLength(), 2)} m)`;
            }
            if (feature.featureType === Potree.NetworkEditor.CadFeatureType.POLYGON) {
                const area = feature.computeArea();
                const areaText = area === null ? "plochu nelze spočítat, hrany se kříží" : `plocha ${formatNumber(area, 1)} m²`;
                return `${areaText}, obvod ${formatNumber(feature.computeHorizontalLength(), 2)} m`;
            }
            return "";
        }

        function flyToFeature(feature) {
            const minimum = feature.points[0].clone();
            const maximum = feature.points[0].clone();
            for (const point of feature.points) {
                minimum.min(point);
                maximum.max(point);
            }
            const target = minimum.clone().add(maximum).multiplyScalar(0.5);
            const distance = Math.max(minimum.distanceTo(maximum) * 1.5, flyToMinimumDistanceMetres);
            const yaw = viewer.scene.view.yaw;
            const pitch = Math.min(viewer.scene.view.pitch, flyToMaximumPitch);
            const position = [
                target.x + Math.sin(yaw) * Math.cos(pitch) * distance,
                target.y - Math.cos(yaw) * Math.cos(pitch) * distance,
                target.z - Math.sin(pitch) * distance
            ];
            viewer.scene.view.setView(position, target.toArray(), flyToDurationMilliseconds);
        }

        function focusFeature(feature) {
            if (cadTool.isDrawing) {
                cadTool.finishDrawing();
            }
            if (dtmInfoTool.active) {
                dtmInfoTool.deactivate();
            }
            cadDocument.setLayerVisible(feature.layerId, true);
            cadEditTool.select(feature);
            flyToFeature(feature);
        }

        function createSelectedFeatureItems() {
            const summary = $("<li class=\"network-editor-note\"></li>");
            const profileButton = $("<input type=\"button\">")
                .val("Výškový profil")
                .on("click", () => featureProfile.show(cadEditTool.selectedFeature));
            featureViewRenderers.push(() => {
                const feature = cadEditTool.selectedFeature;
                const measurement = feature ? describeFeatureMeasurement(feature) : "";
                summary.text(feature ? `Vybráno: ${describeFeature(feature)}${measurement !== "" ? ` – ${measurement}` : ""}` : "Žádný prvek není vybraný.");
                profileButton.prop("disabled", !featureProfile.canShow(feature));
            });
            return [
                summary,
                $("<li></li>").append(profileButton),
                $("<li class=\"network-editor-note\"></li>").text("Profil ukáže body mračna v pásu 1 m podél vybrané linie nebo hrany polygonu.")
            ];
        }

        function createFeatureRow(feature) {
            const measurement = describeFeatureMeasurement(feature);
            const swatch = $("<span class=\"network-editor-swatch\"></span>").css("background", `#${feature.color.getHexString()}`);
            const title = $("<span></span>").text(measurement !== "" ? `${describeFeature(feature)} – ${measurement}` : describeFeature(feature));
            return $("<div class=\"network-editor-feature\"></div>")
                .toggleClass("network-editor-active", feature === cadEditTool.selectedFeature)
                .append(swatch, title)
                .on("click", () => focusFeature(feature));
        }

        function createFeatureListItem() {
            const featureList = $("<li></li>");
            featureViewRenderers.push(() => {
                featureList.empty();
                if (cadDocument.features.length === 0) {
                    featureList.append($("<div class=\"network-editor-note\"></div>").text("Zatím žádné prvky."));
                    return;
                }
                for (const layer of cadDocument.layers) {
                    const layerFeatures = cadDocument.features.filter((feature) => feature.layerId === layer.id);
                    if (layerFeatures.length === 0) {
                        continue;
                    }
                    const groupTitle = layer.visible ? layer.name : `${layer.name} (skrytá)`;
                    featureList.append($("<div class=\"network-editor-feature-group\"></div>").text(groupTitle), layerFeatures.map(createFeatureRow));
                }
            });
            return featureList;
        }

        function saveDrawing() {
            const content = JSON.stringify(Potree.NetworkEditor.createCadFile(cadDocument), null, 2);
            const url = URL.createObjectURL(new Blob([content], { type: "application/json" }));
            $("<a></a>").attr({ href: url, download: `kresba-${datasetName}.json` })[0].click();
            setTimeout(() => URL.revokeObjectURL(url), 0);
        }

        function replaceDrawing(content) {
            if (cadTool.isDrawing) {
                cadTool.finishDrawing();
            }
            cadEditTool.select(null);
            featureProfile.clear();
            cadDocument.replaceContent(content);
            cadHistory.reset();
        }

        async function loadDrawingFile(file, status) {
            if (file.size > maximumDrawingFileBytes) {
                status.text(drawingFileErrorMessages[Potree.NetworkEditor.CadFileErrorCode.TOO_LARGE]);
                return;
            }
            if (cadDocument.features.length > 0 && !window.confirm("Načtení nahradí současnou kresbu. Pokračovat?")) {
                return;
            }
            let content;
            try {
                content = Potree.NetworkEditor.parseCadFile(await file.text());
            } catch (error) {
                status.text(drawingFileErrorMessages[error.code] ?? "Soubor se nepodařilo načíst.");
                return;
            }
            replaceDrawing(content);
            status.text(`Načteno prvků: ${content.features.length}, vrstev: ${content.layers.length}.`);
        }

        function createDrawingFileItems() {
            const status = $("<li class=\"network-editor-note\"></li>").text("Kresba se ukládá v souřadnicích S-JTSK (EPSG:5514).");
            const fileInput = $("<input type=\"file\" accept=\".json,application/json\" hidden>")
                .on("change", (event) => {
                    const file = event.target.files[0];
                    event.target.value = "";
                    if (file) {
                        loadDrawingFile(file, status);
                    }
                });
            const saveButton = $("<input type=\"button\">")
                .val("Uložit kresbu (JSON)")
                .on("click", () => {
                    saveDrawing();
                    status.text(`Uloženo prvků: ${cadDocument.features.length}.`);
                });
            const loadButton = $("<input type=\"button\">")
                .val("Načíst kresbu")
                .on("click", () => fileInput[0].click());
            return [$("<li></li>").append(saveButton, loadButton, fileInput), status];
        }

        function updateEditToolAvailability() {
            cadEditTool.setEnabled(!cadTool.isDrawing && !dtmInfoTool.active);
        }

        function loadCadastreLayer(layerId) {
            const extent = mapPlane.computeViewExtent(cadastreExtentMetres);
            if (!extent) {
                cadastreOverlay.dispatchEvent({ type: "layer_failed", layerId: layerId });
                return;
            }
            loadedCadastreLayers.add(layerId);
            cadastreOverlay.loadLayer(layerId, extent);
        }

        function onCadastreLayerToggled(layerId, checked) {
            if (checked && !loadedCadastreLayers.has(layerId)) {
                loadCadastreLayer(layerId);
            }
            cadastreOverlay.setLayerVisible(layerId, checked);
        }

        function createCadastreLayerItem(cadastreLayer) {
            const identifier = `network_editor_cadastre_${cadastreLayer.layerId}`;
            const status = $("<span class=\"network-editor-status\"></span>");
            cadastreOverlay.addEventListener("layer_loading", (event) => {
                if (event.layerId === cadastreLayer.layerId) {
                    status.text("načítám…");
                }
            });
            cadastreOverlay.addEventListener("layer_loaded", (event) => {
                if (event.layerId === cadastreLayer.layerId) {
                    status.text(event.isTruncated ? `${event.lineCount} čar, neúplné` : `${event.lineCount} čar`);
                }
            });
            cadastreOverlay.addEventListener("layer_failed", (event) => {
                if (event.layerId === cadastreLayer.layerId) {
                    status.text("nepodařilo se načíst");
                }
            });
            return createCheckboxItem(identifier, cadastreLayer.title, false, (checked) => onCadastreLayerToggled(cadastreLayer.layerId, checked))
                .append(status);
        }

        function createCadastreItems() {
            const reloadButton = $("<input type=\"button\">")
                .val("Načíst katastr pro aktuální pohled")
                .on("click", () => {
                    for (const cadastreLayer of cadastreLayers) {
                        if ($(`#network_editor_cadastre_${cadastreLayer.layerId}`).prop("checked")) {
                            loadCadastreLayer(cadastreLayer.layerId);
                        }
                    }
                });
            return [
                ...cadastreLayers.map(createCadastreLayerItem),
                $("<li></li>").append(reloadButton),
                $("<li class=\"network-editor-note\"></li>").text("Katastr: ČÚZK (RÚIAN, ZABAGED), CC BY 4.0. "
                    + "Načte se pro aktuální pohled. Hranice mají přesnost 0,1–1,5 m, cesty jsou orientační.")
            ];
        }

        function createSnappingItem() {
            return createCheckboxItem("network_editor_snapping", "Přichytávání k vrcholům a hranám", true, (checked) => cadSnapper.setEnabled(checked));
        }

        function createTerrainStatusItem() {
            return $("<li class=\"network-editor-note\" id=\"network_editor_terrain_status\"></li>").text("Výška terénu: čeká na mračno");
        }

        function startTerrainHeightSampler(pointCloud) {
            const terrainHeightSampler = new Potree.NetworkEditor.TerrainHeightSampler(pointCloud);
            const terrainStatus = $("#network_editor_terrain_status");
            dtmOverlay.setTerrainHeightSampler(terrainHeightSampler);
            cadastreOverlay.setTerrainHeightSampler(terrainHeightSampler);
            terrainHeightSampler.addEventListener("ready", () => terrainStatus.text("Výška terénu z mračna: hotovo, sítě i katastr leží na terénu."));
            terrainHeightSampler.addEventListener("failed", () => terrainStatus.text("Výšku terénu se nepodařilo spočítat."));
            terrainStatus.text("Výška terénu z mračna: počítám…");
            terrainHeightSampler.start();
        }

        function addNetworkEditorSection() {
            const header = $("<h3 id=\"menu_network_editor\"><span>Síťový editor</span></h3>");
            const list = $("<ul class=\"pv-menu-list\"></ul>").append(
                $("<li></li>").append(createBookmarkButton(litovelCentreBookmark)),
                $("<div class=\"divider\"><span>Vrstvy</span></div>"),
                createCheckboxItem("network_editor_point_cloud", "Mračno bodů", true, setPointCloudsVisible),
                createDtmLayerItem(),
                $("<li class=\"network-editor-note\"></li>").text("DTM: ČÚZK – IS DMVS, přibližný zákres, pouze orientačně."),
                createTerrainStatusItem(),
                $("<div class=\"divider\"><span>Katastr</span></div>"),
                ...createCadastreItems(),
                $("<div class=\"divider\"><span>Kreslení</span></div>"),
                createDrawingButtonsItem(),
                ...createStyleItems(),
                createSnappingItem(),
                createDrawingHintItem(),
                createUndoItem(),
                createFeatureCountItem(),
                ...createSelectedFeatureItems(),
                $("<div class=\"divider\"><span>Vrstvy kreslení</span></div>"),
                ...createLayerItems(),
                $("<div class=\"divider\"><span>Nakreslené prvky</span></div>"),
                createFeatureListItem(),
                $("<div class=\"divider\"><span>Soubor</span></div>"),
                ...createDrawingFileItems(),
                $("<div class=\"divider\"><span>Nástroje</span></div>"),
                $("<li></li>").append(createInfoToolButton())
            );
            const content = $("<div></div>").append(list);
            header.on("click", () => content.slideToggle());
            $("#potree_menu").prepend(header, content);
            for (const eventType of ["feature_added", "feature_removed", "layers_changed"]) {
                cadDocument.addEventListener(eventType, scheduleFeatureViewRender);
            }
            for (const eventType of ["feature_changed", "selection_changed"]) {
                cadEditTool.addEventListener(eventType, scheduleFeatureViewRender);
            }
            scheduleFeatureViewRender();
        }

        infoPanel.find(".network-info-close").on("click", closeInfoPanel);
        dtmInfoTool.addEventListener("query_started", () => {
            isInfoPromptShown = false;
            showInfoMessage("Načítám informace o síti…");
        });
        dtmInfoTool.addEventListener("query_finished", (event) => showInfoResult(event.result));
        dtmInfoTool.addEventListener("query_failed", () => showInfoMessage("Dotaz na DTM se nezdařil."));
        cadTool.addEventListener("drawing_changed", updateEditToolAvailability);
        dtmInfoTool.addEventListener("activation_changed", updateEditToolAvailability);
        cadEditTool.addEventListener("feature_changed", () => cadHistory.capture());
        cadEditTool.addEventListener("selection_changed", () => cadHistory.capture());
        document.addEventListener("keydown", onUndoShortcut);

        const pointCloudLoaded = loadPointCloud(datasetName);
        await viewer.loadGUI();
        viewer.setLanguage("cs");
        viewer.toggleSidebar();
        $("#menu_tools").next().show();
        addNetworkEditorSection();
        const pointCloud = await pointCloudLoaded;
        addPointCloud(pointCloud);
        startTerrainHeightSampler(pointCloud);
        showOrthophotoMap();
        dtmOverlay.setVisible($("#network_editor_dtm").prop("checked"));
    </script>
</body>
</html>
