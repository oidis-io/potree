<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Síťový editor – PoC</title>

    <link rel="stylesheet" type="text/css" href="../build/potree/potree.css">
    <link rel="stylesheet" type="text/css" href="../libs/jquery-ui/jquery-ui.min.css">
    <link rel="stylesheet" type="text/css" href="../libs/openlayers3/ol.css">
    <link rel="stylesheet" type="text/css" href="../libs/spectrum/spectrum.css">
    <link rel="stylesheet" type="text/css" href="../libs/jstree/themes/mixed/style.css">
    <link rel="stylesheet" type="text/css" href="../libs/Cesium/Widgets/CesiumWidget/CesiumWidget.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
    <style>
        :root {
            --editor-panel: #1c2026;
            --editor-surface: #252a32;
            --editor-surface-hover: #2f3541;
            --editor-border: rgba(255, 255, 255, 0.1);
            --editor-border-strong: rgba(255, 255, 255, 0.24);
            --editor-text: #e6e8eb;
            --editor-muted: #98a2ad;
            --editor-accent: #4c9aff;
            --editor-accent-soft: rgba(76, 154, 255, 0.2);
            --editor-accent-strong: #3d87e6;
            --editor-danger: #ff7a7a;
            --editor-radius: 6px;
            --editor-font: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        }
        #sidebar_root {
            display: none;
        }
        #potree_sidebar_container {
            width: 300px;
            overflow-y: auto;
            border-right: 1px solid var(--editor-border);
            background: var(--editor-panel);
        }
        #utility_network_editor_panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px;
            color: var(--editor-text);
            font: 13px/1.4 var(--editor-font);
        }
        .editor-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 2px;
            font-size: 15px;
            font-weight: 600;
        }
        .editor-header .ti {
            color: var(--editor-accent);
            font-size: 20px;
        }
        .editor-tabs,
        .editor-segmented {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2px;
            padding: 3px;
            border-radius: 8px;
            background: var(--editor-surface);
        }
        .editor-tab,
        .editor-segment {
            padding: 5px 0;
            border: 0;
            border-radius: var(--editor-radius);
            background: none;
            color: var(--editor-muted);
            font: inherit;
            text-align: center;
            cursor: pointer;
        }
        .editor-segment {
            padding: 6px 8px;
        }
        .editor-tab:hover,
        .editor-segment:hover {
            color: var(--editor-text);
        }
        .editor-tab.is-active,
        .editor-segment:has(input:checked) {
            background: var(--editor-panel);
            color: var(--editor-text);
            box-shadow: 0 0 0 1px var(--editor-border);
        }
        .editor-segment input {
            display: none;
        }
        .editor-segment:has(input:disabled) {
            opacity: 0.4;
            cursor: default;
        }
        .editor-pane {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .editor-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 26px;
            margin-top: 6px;
            color: var(--editor-muted);
            font-size: 11px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .editor-note,
        .editor-status {
            color: var(--editor-muted);
            font-size: 11px;
        }
        .editor-note:empty {
            display: none;
        }
        .editor-status {
            white-space: nowrap;
        }
        .editor-row {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .editor-grow {
            flex: 1;
            min-width: 0;
        }
        .editor-button {
            display: inline-flex;
            flex: none;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 30px;
            padding: 0 10px;
            border: 1px solid var(--editor-border);
            border-radius: var(--editor-radius);
            background: var(--editor-surface);
            color: var(--editor-text);
            font: inherit;
            cursor: pointer;
        }
        .editor-button:hover:not(:disabled) {
            background: var(--editor-surface-hover);
        }
        .editor-button:disabled {
            opacity: 0.4;
            cursor: default;
        }
        .editor-button .ti {
            font-size: 17px;
        }
        .editor-icon-button {
            width: 30px;
            padding: 0;
        }
        .editor-button.is-active {
            border-color: var(--editor-accent);
            background: var(--editor-accent-soft);
        }
        .editor-button.is-danger {
            color: var(--editor-danger);
        }
        .editor-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
            cursor: pointer;
        }
        .editor-toggle span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #utility_network_editor_panel input[type=checkbox],
        #utility_network_editor_panel input[type=radio] {
            margin: 0;
            accent-color: var(--editor-accent);
        }
        .editor-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .editor-chip-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .editor-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border: 1px solid var(--editor-border);
            border-radius: 999px;
            color: var(--editor-muted);
            cursor: pointer;
            user-select: none;
        }
        .editor-chip input {
            display: none;
        }
        .editor-chip.is-on {
            border-color: var(--editor-border-strong);
            background: var(--editor-surface-hover);
            color: var(--editor-text);
        }
        .editor-chip:has(input:disabled) {
            opacity: 0.4;
            cursor: default;
        }
        .editor-chip:not(.is-on) .editor-dot {
            opacity: 0.35;
        }
        .editor-chip-status {
            color: var(--editor-muted);
            font-size: 11px;
        }
        .editor-dot,
        .editor-swatch {
            flex: none;
            width: 9px;
            height: 9px;
            border-radius: 50%;
        }
        .editor-swatch {
            width: 10px;
            height: 10px;
            border-radius: 3px;
        }
        .editor-details {
            padding: 6px 10px;
            border: 1px solid var(--editor-border);
            border-radius: 8px;
        }
        .editor-details summary {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--editor-muted);
            list-style: none;
            cursor: pointer;
        }
        .editor-details summary::-webkit-details-marker {
            display: none;
        }
        .editor-details[open] summary {
            color: var(--editor-text);
        }
        .editor-details > :not(summary) {
            margin-top: 10px;
        }
        .editor-details-chevron {
            margin-left: auto;
            font-size: 16px;
            transition: transform 0.15s;
        }
        .editor-details[open] .editor-details-chevron {
            transform: rotate(180deg);
        }
        .editor-details summary > span:not(.editor-details-badge) {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .editor-details-badge {
            flex: none;
            margin-left: auto;
            padding: 1px 7px;
            border-radius: var(--editor-radius);
            color: var(--editor-muted);
            font-size: 11px;
        }
        .editor-details-badge:empty {
            display: none;
        }
        .editor-details-badge.is-moved {
            background: rgba(57, 211, 83, 0.15);
            color: #39d353;
        }
        .editor-details-badge + .editor-details-chevron {
            margin-left: 0;
        }
        .editor-empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 16px 12px;
            border: 1px dashed var(--editor-border-strong);
            border-radius: 8px;
            text-align: center;
        }
        .editor-empty-state > .ti,
        #utility_network_editor_scene_prompt > .ti {
            color: var(--editor-accent);
            font-size: 36px;
        }
        .editor-empty-title {
            font-size: 14px;
            font-weight: 600;
        }
        .editor-primary-button {
            height: 36px;
            padding: 0 16px;
            border-color: var(--editor-accent);
            background: var(--editor-accent);
            color: #fff;
            font-weight: 600;
        }
        .editor-primary-button:hover:not(:disabled) {
            background: var(--editor-accent-strong);
        }
        #utility_network_editor_scene_prompt {
            top: 50%;
            left: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            max-width: calc(100% - 40px);
            padding: 20px 28px;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .editor-range {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 2px 8px;
        }
        .editor-range input {
            grid-column: 1 / -1;
            width: 100%;
            accent-color: var(--editor-accent);
        }
        .editor-range-value {
            color: var(--editor-muted);
        }
        .editor-list-row {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 30px;
            padding: 2px 6px;
            border-radius: var(--editor-radius);
        }
        .editor-list-row:hover {
            background: var(--editor-surface);
        }
        .editor-feature {
            cursor: pointer;
        }
        .editor-feature.is-active {
            background: var(--editor-accent-soft);
        }
        .editor-list-title {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .editor-list-value {
            color: var(--editor-muted);
            font-size: 12px;
            white-space: nowrap;
        }
        .editor-group-title {
            margin-top: 4px;
            color: var(--editor-muted);
            font-size: 11px;
        }
        .editor-stack {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .editor-stack .editor-button {
            justify-content: flex-start;
        }
        .editor-scroll-list {
            max-height: 220px;
            overflow-y: auto;
        }
        .editor-scroll-list:empty {
            display: none;
        }
        .editor-alignment-summary {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-height: 48px;
        }
        .editor-alignment-headline {
            color: var(--editor-text);
            font-size: 16px;
            font-weight: 600;
        }
        .editor-alignment-headline.is-message {
            color: var(--editor-muted);
            font-size: 12px;
            font-weight: 400;
        }
        .editor-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 12px;
            color: var(--editor-muted);
            font-size: 11px;
        }
        .editor-legend > span {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .editor-floating {
            position: absolute;
            z-index: 5000;
            box-sizing: border-box;
            border: 1px solid var(--editor-border);
            border-radius: 10px;
            background: rgba(28, 32, 38, 0.94);
            color: var(--editor-text);
            font: 13px/1.4 var(--editor-font);
        }
        #utility_network_editor_toolbar {
            top: 10px;
            left: 50%;
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 4px;
            transform: translateX(-50%);
        }
        #utility_network_editor_toolbar .editor-button {
            border-color: transparent;
            background: none;
        }
        #utility_network_editor_toolbar .editor-button:hover:not(:disabled) {
            background: var(--editor-surface-hover);
        }
        #utility_network_editor_toolbar .editor-button.is-active {
            border-color: var(--editor-accent);
            background: var(--editor-accent-soft);
        }
        #utility_network_editor_toolbar input[type=color] {
            width: 30px;
            height: 26px;
            padding: 0 2px;
            border: 0;
            background: none;
            cursor: pointer;
        }
        .editor-separator {
            align-self: stretch;
            width: 1px;
            margin: 4px;
            background: var(--editor-border);
        }
        #utility_network_editor_hint {
            top: 58px;
            left: 50%;
            max-width: clamp(240px, calc(100% - 672px), 560px);
            padding: 8px 12px;
            font-size: 12px;
            transform: translateX(-50%);
        }
        #utility_network_editor_selection_card {
            top: 56px;
            left: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 300px;
            max-height: calc(100% - 68px);
            overflow-y: auto;
            padding: 10px 12px;
        }
        .editor-card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }
        .editor-card-measurement {
            color: var(--editor-muted);
            font-size: 12px;
        }
        .editor-card-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .editor-field {
            display: grid;
            grid-template-columns: 64px 1fr;
            align-items: center;
            gap: 8px;
        }
        .editor-field label {
            color: var(--editor-muted);
        }
        .editor-field input[type=text],
        .editor-field select {
            height: 28px;
            padding: 0 8px;
            border: 1px solid var(--editor-border);
            border-radius: var(--editor-radius);
            background: var(--editor-surface);
            color: var(--editor-text);
            font: inherit;
        }
        .editor-field input[type=color] {
            width: 40px;
            height: 26px;
            padding: 0;
            border: 0;
            background: none;
        }
        #utility_network_editor_attribution {
            right: 8px;
            bottom: 6px;
            padding: 2px 8px;
            border: 0;
            border-radius: 6px;
            background: rgba(28, 32, 38, 0.7);
            color: var(--editor-muted);
            font-size: 11px;
        }
        #utility_info_panel {
            display: none;
            position: absolute;
            top: 60px;
            right: 10px;
            z-index: 10000;
            width: 340px;
            max-height: calc(100% - 90px);
            overflow-y: auto;
            padding: 10px 12px;
            border: 1px solid var(--editor-border);
            border-radius: 10px;
            background: rgba(28, 32, 38, 0.94);
            color: var(--editor-text);
            font: 12px/1.4 var(--editor-font);
        }
        #utility_info_panel .utility-info-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
        }
        #utility_info_panel .utility-info-close {
            border: none;
            background: none;
            color: var(--editor-text);
            font-size: 18px;
            cursor: pointer;
        }
        #utility_info_panel .utility-info-feature {
            padding: 6px 0;
            border-top: 1px solid var(--editor-border);
        }
        #utility_info_panel .utility-info-title {
            margin-bottom: 2px;
            color: #ffcc66;
            font-weight: 600;
        }
        #utility_info_panel table {
            width: 100%;
            border-collapse: collapse;
        }
        #utility_info_panel td {
            padding: 1px 4px 1px 0;
            vertical-align: top;
        }
        #utility_info_panel td:first-child {
            width: 45%;
            color: var(--editor-muted);
        }
        #utility_info_panel .utility-info-footer {
            margin-top: 6px;
            color: var(--editor-muted);
            font-size: 11px;
        }
    </style>
</head>

<body>
    <script src="../libs/jquery/jquery-3.1.1.min.js"></script>
    <script src="../libs/spectrum/spectrum.js"></script>
    <script src="../libs/jquery-ui/jquery-ui.min.js"></script>
    <script src="../libs/other/BinaryHeap.js"></script>
    <script src="../libs/tween/tween.min.js"></script>
    <script src="../libs/d3/d3.js"></script>
    <script src="../libs/proj4/proj4.js"></script>
    <script src="../libs/openlayers3/ol.js"></script>
    <script src="../libs/i18next/i18next.js"></script>
    <script src="../libs/jstree/jstree.js"></script>
    <script src="../build/potree/potree.js"></script>
    <script src="../libs/plasio/js/laslaz.js"></script>
    <script src="../libs/Cesium/Cesium.js"></script>
    <script src="../libs/copc/index.js"></script>
    <script src="../libs/dxf-parser/dxf-parser.js"></script>

    <div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px;">
        <div id="potree_render_area" style="background-color: #102030;">
            <div id="cesiumContainer" style="position: absolute; inset: 0; background-color: #102030"></div>
        </div>
        <div id="potree_sidebar_container"></div>
    </div>

    <div id="utility_info_panel">
        <div class="utility-info-header">
            <span>Info o síti</span>
            <button class="utility-info-close" type="button" title="Zavřít">×</button>
        </div>
        <div class="utility-info-body"></div>
        <div class="utility-info-footer">Zdroj: ČÚZK – IS DMVS (DTM krajů). Přibližný zákres, pouze orientačně.</div>
    </div>

    <script type="module">
        const requestedDatasetName = new URLSearchParams(window.location.search).get("data") ?? "";
        const datasetName = requestedDatasetName.replace(/[^a-zA-Z0-9_-]/g, "");

        const dtmPropertyLabels = {
            nazevvlastnika: "Vlastník",
            nazevspravce: "Správce",
            nazevprovozovatele: "Provozovatel",
            urovenumisteniobjektuti: "Úroveň umístění",
            tridapresnostipoloha: "Třída přesnosti polohy",
            tridapresnostivyska: "Třída přesnosti výšky",
            zpusobporizeniti: "Způsob pořízení",
            maximalninapetovahladina: "Napěťová hladina",
            doplnek: "Doplněk",
            datumvkladu: "Datum vkladu",
            datumzmeny: "Datum změny",
            neuplnadata: "Neúplná data"
        };

        const viewer = new Potree.Viewer(document.getElementById("potree_render_area"), {
            cesiumRenderArea: document.getElementById("cesiumContainer")
        });
        window.viewer = viewer;
        viewer.setEDLEnabled(false);
        viewer.setFOV(60);
        viewer.setPointBudget(5_000_000);
        viewer.setMinNodeSize(30);
        viewer.setBackground(null);
        viewer.useHQ = true;

        const mapPlane = new Potree.UtilityNetworkEditor.MapPlane(viewer);
        const dtmOverlay = new Potree.UtilityNetworkEditor.DtmOverlay(viewer, mapPlane);
        const surfacePicker = new Potree.UtilityNetworkEditor.SurfacePicker(viewer, mapPlane);
        const cadastreOverlay = new Potree.UtilityNetworkEditor.CadastreOverlay(viewer, mapPlane);
        const alignmentExceptions = new Potree.UtilityNetworkEditor.CadastreAlignmentExceptions();
        const cadastreAlignment = new Potree.UtilityNetworkEditor.CadastreAlignment(cadastreOverlay, alignmentExceptions);
        cadastreAlignment.setShiftLabelFormatter(describeShift);
        const buildingExtrusionLayer = new Potree.UtilityNetworkEditor.BuildingExtrusionLayer(viewer, mapPlane);
        const buildingInfoTool = new Potree.UtilityNetworkEditor.BuildingInfoTool(viewer, buildingExtrusionLayer);
        const dtmInfoTool = new Potree.UtilityNetworkEditor.DtmInfoTool(viewer, mapPlane, dtmOverlay);
        const cadDocument = new Potree.UtilityNetworkEditor.CadDocument();
        const cadView = new Potree.UtilityNetworkEditor.CadView(viewer, cadDocument);
        const cadSnapper = new Potree.UtilityNetworkEditor.CadSnapper(viewer, mapPlane, cadDocument, cadastreOverlay);
        const dxfOverlay = new Potree.UtilityNetworkEditor.DxfOverlay(viewer, mapPlane);
        const attachmentStore = new Potree.UtilityNetworkEditor.AttachmentStore();
        cadSnapper.addSnapSource(dxfOverlay);
        surfacePicker.setSnapper(cadSnapper);
        const cadTool = new Potree.UtilityNetworkEditor.CadTool(viewer, surfacePicker, cadDocument, cadView);
        const cadEditTool = new Potree.UtilityNetworkEditor.CadEditTool(viewer, cadDocument, surfacePicker);
        const cadastreMoveTool = new Potree.UtilityNetworkEditor.CadastreMoveTool(viewer, surfacePicker, cadastreAlignment);
        const cadastreViewChangeDetector = new Potree.UtilityNetworkEditor.ViewChangeDetector(viewer, mapPlane);
        const cadHistory = new Potree.UtilityNetworkEditor.CadHistory(cadDocument, alignmentExceptions);
        const featureProfile = new Potree.UtilityNetworkEditor.FeatureProfile(viewer);
        const storagePrefix = "oidis-utility-network-editor";
        const legacyStoragePrefix = "oidis-network-editor";
        const autosaveKey = datasetName ? `${storagePrefix}:${datasetName}` : storagePrefix;
        moveLegacyMeasurements();
        const cadAutosave = new Potree.UtilityNetworkEditor.CadAutosave(cadDocument, cadHistory, autosaveKey, alignmentExceptions);
        const pointCloudStore = new Potree.UtilityNetworkEditor.PointCloudStore();
        const pointCloudFileExtensions = Potree.UtilityNetworkEditor.POINT_CLOUD_FILE_EXTENSIONS;
        const lastStoredPointCloudKey = `${storagePrefix}:last-stored-point-cloud`;
        const pointCloudDrawingKeyPrefix = `${storagePrefix}:point-cloud`;
        const hiddenDxfLayersKeyPrefix = `${storagePrefix}:dxf-hidden-layers`;
        cadView.setDimensionFormatter((dimension) => formatDimension(dimension));
        cadDocument.addLayer("Vrstva 1");

        const maximumPointCount = 20000000;
        const pointCloudReadErrorCode = Potree.UtilityNetworkEditor.PointCloudReadErrorCode;
        const pointCloudLoadStage = Potree.UtilityNetworkEditor.PointCloudLoadStage;
        const pointCloudErrorMessages = {
            [pointCloudReadErrorCode.UNSUPPORTED_FILE]: "Soubor není podporované mračno bodů. Otevřete LAS, LAZ, PLY, XYZ, TXT, PTS nebo CSV.",
            [pointCloudReadErrorCode.UNSUPPORTED_FORMAT]: "Tuto variantu formátu zatím neumíme načíst.",
            [pointCloudReadErrorCode.EMPTY]: "Soubor neobsahuje body, nebo je poškozený.",
            [pointCloudReadErrorCode.TOO_LARGE]: "Soubor je na zpracování v prohlížeči příliš velký.",
            [pointCloudReadErrorCode.NOT_STORED]: "Mračno už v prohlížeči uložené není, otevřete soubor znovu.",
            [pointCloudReadErrorCode.CANCELED]: "Načítání mračna je zrušené."
        };
        const pointCloudStageTexts = {

        async function loadDatasetPointCloud(name) {
            const url = `./data/${name}/ept/ept.json`;
            const response = await fetch(url).catch(() => null);
            if (!response?.ok) {
                return null;
            }
            return new Promise((resolve) => {
                Potree.loadPointCloud(url, name, (event) => resolve(event.pointcloud));
            });
        }

        function applyColorMode(pointCloud) {
            const material = pointCloud.material;
            if (selectedColorMode === "intensity" && !Number.isFinite(material.intensityRange[0])) {
                material.intensityRange = defaultIntensityRange;
            }
            material.activeAttributeName = selectedColorMode;
        }

        function setColorMode(attributeName) {
            selectedColorMode = attributeName;
            viewer.scene.pointclouds.forEach(applyColorMode);
        }

        function updateColorModeControl() {
            pointCloudColorModes.forEach((colorMode, index) => {
                $(`#utility_network_editor_color_mode_${index}`).prop("disabled", !colorMode.isAvailable(pointCloudAttributes));
            });
            const selectedMode = pointCloudColorModes.find((colorMode) => colorMode.attributeName === selectedColorMode);
            if (!selectedMode?.isAvailable(pointCloudAttributes)) {
                selectedColorMode = pointCloudAttributes.hasColors ? "rgba" : "elevation";
            }
            const selectedIndex = pointCloudColorModes.findIndex((colorMode) => colorMode.attributeName === selectedColorMode);
            $(`#utility_network_editor_color_mode_${selectedIndex}`).prop("checked", true);
        }

        function addPointCloud(pointCloud) {
            const material = pointCloud.material;
            const pointCloudCheckbox = $("#utility_network_editor_point_cloud");
            applyColorMode(pointCloud);
            material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
            material.size = pointSize;
            material.minSize = 2;
            pointCloud.visible = pointCloudCheckbox.prop("checked");
            pointCloud.addEventListener("visibility_changed", () => pointCloudCheckbox.prop("checked", pointCloud.visible));
            viewer.scene.addPointCloud(pointCloud);
            viewer.fitToScreen();
        }

        function setPointCloudsVisible(visible) {
            for (const pointCloud of viewer.scene.pointclouds) {
                pointCloud.visible = visible;
            }
        }

        function setPointSize(size) {
            pointSize = size;
            for (const pointCloud of viewer.scene.pointclouds) {
                pointCloud.material.size = size;
            }
        }

        function setBaseMap(provider) {
            selectedBaseMapProvider = provider;
            viewer.cesiumRender.init();
            viewer.setShowCesium(provider !== null);
            $("#show_cesium").prop("checked", provider !== null);
            if (provider !== null) {
                $("#show_cesium_map_provider input[type=checkbox]").each((index, element) => {
                    element.checked = element.value === provider;
                });
                $(`#show_cesium_map_provider input[value=${provider}]`).trigger("change");
            }
            updateAttribution();
        }

        function startMapAndUtilities() {
            if (isMapStarted) {
                return;
            }
            isMapStarted = true;
            setBaseMap(selectedBaseMapProvider);
            dtmOverlay.setVisible($("#utility_network_editor_dtm").prop("checked"));
        }

        function updateAttribution() {
            const baseMap = baseMaps.find((map) => map.provider === selectedBaseMapProvider);
            const isCadastreShown = buildingExtrusionLayer.visible
                || cadastreLayers.some((cadastreLayer) => $(`#utility_network_editor_cadastre_${cadastreLayer.layerId}`).prop("checked"));
            const cadastreAttribution = cadastreAlignment.isAlignmentShown()
                ? `Katastr © ČÚZK, CC BY 4.0, zarovnáno podle ${findAlignmentReference().sourceText} (orientační)`
                : "Katastr © ČÚZK, CC BY 4.0";
            const parts = [
                baseMap?.attribution ?? "",
                isCadastreShown ? cadastreAttribution : "",
                buildingExtrusionLayer.visible ? "Výšky budov: ČÚZK – DMP a DMR 5G, orientační" : "",
                $("#utility_network_editor_dtm").prop("checked") ? "Sítě: ČÚZK – IS DMVS, orientační" : ""
            ].filter((part) => part !== "");
            $("#utility_network_editor_attribution").text(parts.join(" · ")).toggle(parts.length > 0);
        }

        function formatPropertyValue(value) {
            if (typeof value === "boolean") {
                return value ? "ano" : "ne";
            }
            return String(value);
        }

        function createFeatureElement(properties) {
            const title = $("<div class=\"utility-info-title\"></div>").text(properties.objektovytypnazev ?? "Objekt DTM");
            const table = $("<table></table>");
            for (const [key, label] of Object.entries(dtmPropertyLabels)) {
                const value = properties[key];
                if (value === null || value === undefined || value === "") {
                    continue;
                }
                table.append($("<tr></tr>").append($("<td></td>").text(label), $("<td></td>").text(formatPropertyValue(value))));
            }
            return $("<div class=\"utility-info-feature\"></div>").append(title, table);
        }

        function showInfoPanel(title, content, footer) {
            infoPanel.find(".utility-info-header span").text(title);
            infoPanel.find(".utility-info-footer").text(footer);
            infoPanelBody.empty().append(content);
            infoPanel.show();
        }

        function showInfoMessage(message) {
            showInfoPanel("Info o síti", $("<div></div>").text(message), dtmInfoFooter);
        }

        function showInfoResult(result) {
            if (result.features.length === 0) {
                showInfoMessage("V místě kliknutí není žádná síť.");
                return;
            }
            const regionNote = result.region ? [$("<div class=\"editor-note\"></div>").text(`DTM: ${result.region}`)] : [];
            showInfoPanel("Info o síti", [...regionNote, ...result.features.map(createFeatureElement)], dtmInfoFooter);
        }

        function closeInfoPanel() {
            isInfoPromptShown = false;
            infoPanel.hide();
            dtmInfoTool.clearMarker();
            buildingExtrusionLayer.setSelectedIdentifier(null);
        }

        function describeCode(titles, code) {
            return titles[code] ?? "nezjištěno";
        }

        function describeBuildingHeightSource(building) {
            if (building.source === buildingHeightSource.POINT_CLOUD) {
                return `z mračna (${formatNumber(building.sampleCount, 0)} bodů)`;
            }
            if (building.source === buildingHeightSource.SURFACE_MODEL) {
                return `z modelu povrchu ČÚZK (${formatNumber(building.sampleCount, 0)} buněk)`;
            }
            if (building.source === buildingHeightSource.FLOORS) {
                return `odhad z počtu podlaží (${building.attributes.floorCount} × 3 m)`;
            }
            return "není z čeho určit";
        }

        function describeBuildingRows(building) {
            const isMeasured = building.source === buildingHeightSource.POINT_CLOUD;
            const heightText = building.roofHeight === null
                ? "neznámá"
                : `${isMeasured ? "" : "≈ "}${formatNumber(building.roofHeight - building.baseHeight, 1)} m`;
            const attributes = building.attributes;
            return [
                ["Výška budovy", heightText],
                ["Zdroj výšky", describeBuildingHeightSource(building)],

                ["Vodovod", describeCode(buildingWaterConnectionTitles, attributes.waterConnectionCode)],

                ["Obrys", building.isAligned ? "zarovnaný podle mapy (orientačně)" : "z katastru ČÚZK"],

        function describeLoadedPointCloud(result) {
            const thinnedText = result.pointCount < result.sourcePointCount ? `, zředěno z ${formatNumber(result.sourcePointCount, 0)}` : "";
            const storageText = result.isFromStorage ? " Otevřeno z úložiště prohlížeče." : (result.isStored ? " Uloženo v prohlížeči, příště se otevře hned." : "");
            const coordinateText = looksLikeKrovakCoordinates(result.origin) ? "" : " Souřadnice nevypadají jako S-JTSK (EPSG:5514), mapa, DTM a katastr nemusí sedět.";
            return `Načteno bodů ${formatNumber(result.pointCount, 0)}${thinnedText}.${storageText}${coordinateText}`;
        }

        function disposePointCloud(pointCloud) {
            const pendingNodes = [pointCloud.pcoGeometry.root];
            while (pendingNodes.length > 0) {
                const node = pendingNodes.pop();
                node.geometry?.dispose();
                pendingNodes.push(...Object.values(node.children ?? {}).filter(Boolean));
            }
        }

        function looksLikeKrovakCoordinates(origin) {
            return origin[0] < -300000 && origin[0] > -950000 && origin[1] < -900000 && origin[1] > -1350000;
        }

        function removePointCloud(pointCloud) {
            const pointClouds = viewer.scene.pointclouds;
            pointClouds.splice(pointClouds.indexOf(pointCloud), 1);
            viewer.scene.scenePointCloud.remove(pointCloud);
        }

        function replacePointCloud(pointCloud, attributes) {
            for (const previousPointCloud of [...viewer.scene.pointclouds]) {
                removePointCloud(previousPointCloud);
                disposePointCloud(previousPointCloud);
            }
            pointCloudAttributes = attributes;
            updateColorModeControl();
            addPointCloud(pointCloud);
            startTerrainHeightSampler(pointCloud);
            startMapAndUtilities();
            updatePointCloudControls(true);
            buildingExtrusionLayer.setPointCloud(pointCloud);
        }

        function setPointCloudLoading(isLoading) {
            $("#utility_network_editor_cancel_point_cloud").toggle(isLoading);
        }

        async function runPointCloudLoad(startLoad) {
            pointCloudLoadController?.abort();
            const controller = new AbortController();
            pointCloudLoadController = controller;
            setPointCloudLoading(true);
            try {
                const result = await startLoad({
                    maximumPointCount: maximumPointCount,
                    signal: controller.signal,
                    onProgress: (progress) => showPointCloudStatus(describePointCloudProgress(progress))
                });
                applyLoadedPointCloud(result);
                return result;
            } catch (error) {
                if (controller === pointCloudLoadController) {
                    showPointCloudStatus(pointCloudErrorMessages[error.code] ?? "Mračno se nepodařilo načíst.");
                }
                return null;
            } finally {
                if (controller === pointCloudLoadController) {
                    pointCloudLoadController = null;
                    setPointCloudLoading(false);
                }
            }
        }

        function applyLoadedPointCloud(result) {
            result.pointCloud.setName(result.fileName);
            replacePointCloud(result.pointCloud, result);
            $("#utility_network_editor_point_cloud_name").text(result.fileName);
            showPointCloudStatus(describeLoadedPointCloud(result));
            rememberStoredPointCloud(result.storageKey);
            if (result.isStored && !result.isFromStorage) {
                Potree.UtilityNetworkEditor.PointCloudStore.requestPersistence().catch(() => false);
            }
            switchDrawingToPointCloud(createPointCloudDrawingKey(result));
            renderStoredPointClouds();
        }

        function openPointCloudFile(file) {
            showPointCloudStatus(describePointCloudProgress({ stage: pointCloudLoadStage.READING, share: 0 }));
            return runPointCloudLoad((options) => Potree.UtilityNetworkEditor.loadPointCloudFile(file, options));
        }

        function openStoredPointCloud(storageKey) {
            showPointCloudStatus(describePointCloudProgress({ stage: pointCloudLoadStage.RESTORING, share: 0 }));
            return runPointCloudLoad((options) => Potree.UtilityNetworkEditor.loadStoredPointCloud(storageKey, options));
        }

        function rememberStoredPointCloud(storageKey) {
            try {
                if (storageKey) {
                    window.localStorage.setItem(lastStoredPointCloudKey, storageKey);
                } else {
                    window.localStorage.removeItem(lastStoredPointCloudKey);
                }
            } catch {
                return;
            }
        }

        function readLastStoredPointCloud() {
            try {
                return window.localStorage.getItem(lastStoredPointCloudKey);
            } catch {
                return null;
            }
        }

        async function restoreLastStoredPointCloud() {
            const storageKey = readLastStoredPointCloud();
            if (!storageKey || !Potree.UtilityNetworkEditor.PointCloudStore.isSupported()) {
                return;
            }
            if (!(await openStoredPointCloud(storageKey))) {
                rememberStoredPointCloud(null);
                showPointCloudStatus("");

        function formatBytes(byteCount) {
            const kilobytes = byteCount / 1024;
            const megabytes = kilobytes / 1024;
            if (megabytes >= 1024) {
                return `${formatNumber(megabytes / 1024, 1)} GB`;
            }
            return megabytes >= 1 ? `${formatNumber(megabytes, 0)} MB` : `${formatNumber(Math.max(1, kilobytes), 0)} kB`;
        }

            await pointCloudStore.remove(entry.storageKey).catch(() => null);

                ? "Zatím žádné. Každé otevřené mračno se sem samo uloží, prohlížeč si pamatuje poslední 3."

        function expandExtent(extent, share, maximumSize) {
            const expandRange = (minimum, maximum) => {
                const center = (minimum + maximum) / 2;
                const halfSize = Math.min(maximumSize, (maximum - minimum) * (1 + 2 * share)) / 2;
                return [center - halfSize, center + halfSize];
            };
            const [minimumX, maximumX] = expandRange(extent.minimumX, extent.maximumX);
            const [minimumY, maximumY] = expandRange(extent.minimumY, extent.maximumY);
            return { minimumX: minimumX, minimumY: minimumY, maximumX: maximumX, maximumY: maximumY };
        }

        function containsExtent(outer, inner) {
            const tolerance = 1;
            return outer.minimumX <= inner.minimumX + tolerance
                && outer.minimumY <= inner.minimumY + tolerance
                && outer.maximumX >= inner.maximumX - tolerance
                && outer.maximumY >= inner.maximumY - tolerance;
        }

        function computeCadastreExtent() {
            const viewExtent = mapPlane.computeViewExtent(cadastreExtentMetres);
            return viewExtent ? expandExtent(viewExtent, cadastreMarginShare, cadastreExtentMetres) : null;
        }

        function loadCadastreLayer(layerId) {
            const extent = computeCadastreExtent();
            if (!extent) {
                cadastreOverlay.dispatchEvent({ type: "layer_failed", layerId: layerId });
                return;
            }
            loadedCadastreExtents.set(layerId, extent);
            cadastreOverlay.loadLayer(layerId, extent);
        }

        function isCadastreLayerChecked(layerId) {
            return $(`#utility_network_editor_cadastre_${layerId}`).prop("checked");
        }

        function isCadastreLayerNeeded(layerId) {
            return isCadastreLayerChecked(layerId) || (layerId === Potree.UtilityNetworkEditor.CadastreLayer.BUILDINGS && buildingExtrusionLayer.visible);
        }

        function isCadastreLayerLoadedForView(layerId) {
            const loadedExtent = loadedCadastreExtents.get(layerId);
            const viewExtent = mapPlane.computeViewExtent(cadastreExtentMetres);
            return Boolean(loadedExtent) && (!viewExtent || containsExtent(loadedExtent, viewExtent));
        }

        function loadCadastreForView() {
            if (cadastreMoveTool.active) {
                return;
            }
            for (const cadastreLayer of cadastreLayers) {
                if (isCadastreLayerNeeded(cadastreLayer.layerId) && !isCadastreLayerLoadedForView(cadastreLayer.layerId)) {
                    loadCadastreLayer(cadastreLayer.layerId);
                }
            }
        }

        function requestCadastreViewCheck() {
            cadastreViewChangeTime = performance.now();
        }

        function watchViewForCadastre() {
            if (cadastreViewChangeDetector.hasChanged()) {
                requestCadastreViewCheck();
                return;
            }
            if (cadastreViewChangeTime !== null && performance.now() - cadastreViewChangeTime >= cadastreReloadDelayMilliseconds) {
                cadastreViewChangeTime = null;
                loadCadastreForView();
            }
        }

        function onCadastreLayerToggled(layerId, checked) {
            if (checked && !isCadastreLayerLoadedForView(layerId)) {
                loadCadastreLayer(layerId);

            cadastreOverlay.setLayerVisible(layerId, checked);

                description: cadastreLayer.description,
                checked: false,
                onChange: (checked) => onCadastreLayerToggled(cadastreLayer.layerId, checked)
            });
            const status = $("<span class=\"editor-chip-status\" title=\"Počet načtených čar\"></span>");
            const isThisLayer = (event) => event.layerId === cadastreLayer.layerId;
            cadastreOverlay.addEventListener("layer_loading", (event) => isThisLayer(event) && status.text("…"));
            cadastreOverlay.addEventListener("layer_loaded", (event) => isThisLayer(event) && status.text(event.isTruncated ? `${event.lineCount}+` : String(event.lineCount)));
            cadastreOverlay.addEventListener("layer_failed", (event) => isThisLayer(event) && status.text("chyba"));
            return chip.append(status);
        }

        function reloadVisibleCadastreLayers() {
            for (const cadastreLayer of cadastreLayers) {

            if (event.isLoadingSurfaceModel) {

            }
            if (event.pendingCount > 0) {
                return `počítám ${event.buildingCount - event.pendingCount}/${event.buildingCount}`;

            return `${event.measuredCount + event.surfaceCount + event.estimatedCount} z ${event.buildingCount}`;

        function createBuildingsSection() {

        function showDxfStatus(text) {
            $("#utility_network_editor_dxf_status").text(text);
        }

        function describeDxfDocument(fileName, document, isStored) {
            const coordinateText = document.isKrovak
                ? dxfAxisTransformTexts[document.axisTransform] ?? ""
                : " Souřadnice nevypadají jako S-JTSK, výkres nemusí sedět na mapu.";
            const shapeText = document.isFlat ? " Výkres je 2D, je položený na terén." : " Výkres je 3D, má vlastní výšky.";
            const unsupportedText = document.unsupportedEntityCount > 0 ? ` Nepodporovaných objektů: ${document.unsupportedEntityCount}.` : "";
            const truncatedText = document.isTruncated ? " Výkres je zkrácený na prvních 200 000 objektů." : "";
            const storedText = isStored ? " Uloženo k tomuto mračnu." : "";
            return `${fileName}: vrstev ${document.layers.length}, objektů ${document.primitives.length}.${shapeText}${coordinateText}${unsupportedText}${truncatedText}${storedText}`;
        }

        function flyToDxfDocument(documentEntry) {
            const bounds = documentEntry.bounds;
            const centerX = (bounds.minimumX + bounds.maximumX) / 2;
            const centerY = (bounds.minimumY + bounds.maximumY) / 2;
            const height = documentEntry.isFlat ? dxfOverlay.getTerrainHeight(centerX, centerY) : (bounds.minimumZ + bounds.maximumZ) / 2;
            flyToTarget([centerX, centerY, height], Math.max(bounds.maximumX - bounds.minimumX, bounds.maximumY - bounds.minimumY));
        }

        async function storeDxfFile(file) {
            if (!Potree.UtilityNetworkEditor.AttachmentStore.isSupported()) {
                return null;
            }
            try {
                return await attachmentStore.save(cadAutosave.storageKey, file.name, new Uint8Array(await file.arrayBuffer()));
            } catch {
                return null;
            }
        }

        async function readDxfDocument(file) {
            return Potree.UtilityNetworkEditor.createDxfDocument(await Potree.UtilityNetworkEditor.readDxfFile(file));
        }

        function replaceDxfDocument(previousDocument, document, storedName) {
            dxfOverlay.removeDocument(previousDocument.id);
            const documentId = dxfOverlay.addDocument(previousDocument.fileName, document, storedName);
            for (const layer of previousDocument.layers.filter((layer) => !layer.visible)) {
                dxfOverlay.setLayerVisible(documentId, layer.name, false);
            }
            return documentId;
        }

        async function addDxfFile(file) {
            if (file.size > maximumDxfFileBytes) {
                showDxfStatus("Výkres je příliš velký (max. 50 MB).");
                return;
            }
            showDxfStatus(`Načítám ${file.name}…`);
            let document;
            try {
                document = await readDxfDocument(file);
            } catch (error) {
                showDxfStatus(dxfErrorMessages[error.code] ?? "Výkres DXF se nepodařilo načíst.");
                return;
            }
            if (document.primitives.length === 0) {
                showDxfStatus("Výkres neobsahuje nic, co umíme zobrazit.");
                return;
            }
            const storedName = await storeDxfFile(file);
            const previousDocument = dxfOverlay.listDocuments().find((documentEntry) => documentEntry.fileName === file.name);
            const documentId = previousDocument
                ? replaceDxfDocument(previousDocument, document, storedName)
                : dxfOverlay.addDocument(file.name, document, storedName);
            const replacedText = previousDocument ? " Předchozí výkres se stejným názvem je nahrazený." : "";
            showDxfStatus(`${describeDxfDocument(file.name, document, storedName !== null)}${replacedText}`);
            if (viewer.scene.pointclouds.length === 0) {
                startMapAndUtilities();
            }
            flyToDxfDocument(dxfOverlay.listDocuments().find((documentEntry) => documentEntry.id === documentId));
        }

        function readHiddenDxfLayers(drawingKey) {
            try {
                return JSON.parse(window.localStorage.getItem(`${hiddenDxfLayersKeyPrefix}:${drawingKey}`) ?? "{}");
            } catch {
                return {};
            }
        }

        function storeHiddenDxfLayers() {
            if (isRestoringDxfDocuments) {
                return;
            }
            const hiddenLayers = {};
            for (const documentEntry of dxfOverlay.listDocuments()) {
                if (documentEntry.storedName) {
                    hiddenLayers[documentEntry.storedName] = documentEntry.layers.filter((layer) => !layer.visible).map((layer) => layer.name);
                }
            }
            try {
                window.localStorage.setItem(`${hiddenDxfLayersKeyPrefix}:${cadAutosave.storageKey}`, JSON.stringify(hiddenLayers));
            } catch {
                return;
            }
        }

        async function restoreDxfDocuments(drawingKey) {
            isRestoringDxfDocuments = true;
            dxfOverlay.clear();
            const attachments = Potree.UtilityNetworkEditor.AttachmentStore.isSupported() ? await attachmentStore.list(drawingKey).catch(() => []) : [];
            const hiddenLayers = readHiddenDxfLayers(drawingKey);
            for (const attachment of attachments) {
                try {
                    const file = await attachmentStore.load(drawingKey, attachment.name);
                    if (file && cadAutosave.storageKey === drawingKey) {
                        const documentId = dxfOverlay.addDocument(attachment.name, await readDxfDocument(file), attachment.name);
                        for (const layerName of hiddenLayers[attachment.name] ?? []) {
                            dxfOverlay.setLayerVisible(documentId, layerName, false);
                        }
                    }
                } catch {
                    continue;
                }
            }
            isRestoringDxfDocuments = false;
            if (attachments.length > 0) {
                showDxfStatus(`Obnoveno výkresů DXF k tomuto mračnu: ${attachments.length}.`);
            }
        }

        async function removeDxfDocument(documentEntry) {
            if (!window.confirm(`Odebrat výkres ${documentEntry.fileName}? Prvky převzaté do kresby zůstanou.`)) {
                return;
            }
            dxfOverlay.removeDocument(documentEntry.id);
            if (documentEntry.storedName) {
                await attachmentStore.remove(cadAutosave.storageKey, documentEntry.storedName).catch(() => null);
            }
            showDxfStatus(`Výkres ${documentEntry.fileName} je odebraný.`);
        }

        function createConvertedLayerName(layerName, fileName) {
            return `${layerName} (${fileName})`;
        }

        function showConvertedDxfLayers() {
            const drawingLayerNames = new Set(cadDocument.layers.map((layer) => layer.name));
            let shownLayerCount = 0;
            for (const documentEntry of dxfOverlay.listDocuments()) {
                for (const layer of documentEntry.layers) {
                    if (!layer.visible && drawingLayerNames.has(createConvertedLayerName(layer.name, documentEntry.fileName))) {
                        dxfOverlay.setLayerVisible(documentEntry.id, layer.name, true);
                        shownLayerCount++;
                    }
                }
            }
            return shownLayerCount;
        }

        function convertDxfLayer(documentEntry, layerName) {
            const primitives = dxfOverlay.listLayerPrimitives(documentEntry.id, layerName);
            const segmentCount = Potree.UtilityNetworkEditor.countConvertibleSegments(primitives);
            if (primitives.every((primitive) => primitive.isSymbol)) {
                showDxfStatus(`Vrstva „${layerName}“ obsahuje jen značky a šrafy, ty zůstávají v podkladu.`);
                return;
            }
            if (segmentCount > maximumConvertedSegmentCount) {
                showDxfStatus(`Vrstva „${layerName}“ je na převzetí moc velká (${formatNumber(segmentCount, 0)} úseků, nejvýš ${formatNumber(maximumConvertedSegmentCount, 0)}).`);
                return;
            }
            const activeLayerId = cadDocument.activeLayerId;
            const layer = cadDocument.addLayer(createConvertedLayerName(layerName, documentEntry.fileName));
            const isFlat = dxfOverlay.findDocument(documentEntry.id).document.isFlat;
            const resolveHeight = (point) => (isFlat ? dxfOverlay.getTerrainHeight(point.x, point.y) : point.z);
            const featureData = Potree.UtilityNetworkEditor.convertDxfPrimitivesToFeatureData(primitives, layer.id, resolveHeight);
            for (const data of featureData) {
                cadDocument.addFeature(Potree.UtilityNetworkEditor.CadFeature.fromData(data));
            }
            cadDocument.setActiveLayer(activeLayerId);
            cadHistory.capture();
            dxfOverlay.setLayerVisible(documentEntry.id, layerName, false);
            showDxfStatus(`Převzato do kresby: ${featureData.length} prvků ve vrstvě „${layer.name}“. Značky a šrafy zůstaly v podkladu.`);
        }

        function createDxfLayerRow(documentEntry, layer) {
            const identifier = `utility_network_editor_dxf_${documentEntry.id}_${layer.name.replace(/[^a-zA-Z0-9_-]/g, "_")}`;
            const toggle = createToggle(identifier, layer.name, layer.visible, (checked) => dxfOverlay.setLayerVisible(documentEntry.id, layer.name, checked)).addClass("editor-grow");
            toggle.find("input").after($("<span class=\"editor-dot\"></span>").css("background", `#${layer.color.toString(16).padStart(6, "0")}`));
            return $("<div class=\"editor-list-row\"></div>").append(
                toggle,
                $("<span class=\"editor-list-value\"></span>").text(String(layer.primitiveCount)),
                createButton({ icon: "file-import", title: "Převzít vrstvu do kresby, kde ji jde upravovat", onClick: () => convertDxfLayer(documentEntry, layer.name) })
            );
        }

        function createDxfDocumentElement(documentEntry) {
            const header = $("<div class=\"editor-list-row\"></div>").append(

                $(`#utility_network_editor_alignment_mode_${alignedIndex}`).prop("checked", true);

            for (const layerId of [Potree.UtilityNetworkEditor.CadastreLayer.BUILDINGS, Potree.UtilityNetworkEditor.CadastreLayer.REFERENCE_BUILDINGS]) {

        function describeAlignmentSummary(event) {
            const state = Potree.UtilityNetworkEditor.AlignmentEntryState;
            const countEntries = (condition) => event.entries.filter(condition).length;
            const manualCount = countEntries((entry) => entry.state === state.MANUAL);
            const manualText = manualCount > 0 ? `ručně: ${manualCount}` : "";
            if (event.phase !== Potree.UtilityNetworkEditor.AlignmentPhase.READY) {
                return { headline: alignmentPhaseTexts[event.phase], detail: manualText, tooltip: "", isMessage: true, badge: alignmentPhaseBadges[event.phase] ?? "", isBadgeHighlighted: false };
            }
            const status = Potree.UtilityNetworkEditor.BuildingMatchStatus;
            const estimatedCount = countEntries((entry) => entry.state === state.MOVED && entry.isEstimate);
            const keptCount = countEntries((entry) => entry.state === state.KEPT);
            const buildingCount = Object.values(event.summary).reduce((sum, count) => sum + count, 0);
            const isNothingShifted = event.summary[status.SHIFTED] + event.summary[status.INTERPOLATED] === 0;
            const unknownCount = event.summary[status.DIFFERENT_SHAPE] + event.summary[status.UNMATCHED];
            const movedCount = countEntries((entry) => entry.state === state.MOVED && !entry.isEstimate);
            return {
                headline: isNothingShifted ? "Nic se neposunulo" : `Posunuto: ${movedCount}`,
                detail: [
                    `z ${buildingCount === 1 ? "1 budovy" : `${buildingCount} budov`} · podle ${findAlignmentReference().sourceText}`,
                    estimatedCount > 0 ? `odhad: ${estimatedCount}` : "",
                    manualText,
                    keptCount > 0 ? `ponecháno: ${keptCount}` : ""
                ].filter((part) => part !== "").join(" · "),
                tooltip: `Sedí: ${event.summary[status.ALIGNED]}. Nedá se posoudit: ${unknownCount} `
                    + `(jiný tvar ${event.summary[status.DIFFERENT_SHAPE]}, bez páru ${event.summary[status.UNMATCHED]}).`,
                isMessage: false,
                badge: isNothingShifted ? "nic" : `${movedCount} posunuto`,
                isBadgeHighlighted: !isNothingShifted
            };
        }

        function describeAlignedBuilding(entry) {
            return entry.label !== "" ? `Budova č. ${entry.label}` : "Budova bez čísla";
        }

        function describeShift(entry) {
            const rotationText = Math.abs(entry.transform.rotationDegrees) >= 0.5 ? `, ${formatNumber(entry.transform.rotationDegrees, 1)}°` : "";
            return `${entry.isEstimate ? "≈ " : ""}${formatNumber(entry.shiftLength, 1)} m${rotationText}`;
        }

        function isKeptEntry(entry) {
            return entry.state === Potree.UtilityNetworkEditor.AlignmentEntryState.KEPT;
        }

        function isManualEntry(entry) {
            return entry.state === Potree.UtilityNetworkEditor.AlignmentEntryState.MANUAL;
        }

        function chooseAlignmentEntryColor(entry) {
            if (isKeptEntry(entry)) {
                return alignmentEntryColors.kept;
            }
            if (isManualEntry(entry)) {
                return alignmentEntryColors.manual;
            }
            return entry.isEstimate ? alignmentEntryColors.estimated : alignmentEntryColors.measured;
        }

        function describeAlignmentEntry(entry) {
            if (isKeptEntry(entry)) {
                return "Zarovnání je vypnuté, budova zůstává v poloze z katastru.";
            }
            if (isManualEntry(entry)) {
                return "Posunuto ručně.";
            }
            if (entry.isEstimate) {
                return `Odhad podle ${entry.neighbourCount} okolních budov, sama se podle ${findAlignmentReference().sourceText} zarovnat nedala.`;
            }
            const overlapText = `${formatNumber(entry.originalOverlap * 100, 0)} % → ${formatNumber(entry.fittedOverlap * 100, 0)} %`;
            const blockText = entry.blockSize > 1 ? ` jako blok ${entry.blockSize} budov` : "";
            return `Zarovnáno${blockText} podle ${findAlignmentReference().sourceText}, shoda obrysů ${overlapText}.`;
        }

        function describeAlignmentEntryValue(entry) {
            if (isKeptEntry(entry)) {
                return "původní poloha";
            }
            if (isManualEntry(entry)) {
                return `ručně · ${describeShift(entry)}`;
            }
            return entry.blockSize > 1 ? `${describeShift(entry)} · blok` : describeShift(entry);
        }

        function createAlignmentEntryButton(entry) {
            if (isKeptEntry(entry)) {
                return createButton({ icon: "arrows-move", title: "Znovu zarovnat", onClick: () => cadastreAlignment.alignAgain(entry.identifier) });
            }
            if (isManualEntry(entry)) {
                return createButton({ icon: "arrow-back-up", title: "Zrušit ruční posun", onClick: () => cadastreAlignment.alignAgain(entry.identifier) });
            }
            return createButton({ icon: "arrow-back-up", title: "Ponechat původní polohu z katastru", onClick: () => cadastreAlignment.keepOriginalPosition(entry.identifier, entry.label) });
        }

        function createAlignmentEntryRow(entry) {
            const toggleButton = createAlignmentEntryButton(entry);
            toggleButton.on("click", (event) => event.stopPropagation());
            return $("<div class=\"editor-list-row editor-feature\"></div>")
                .attr("title", describeAlignmentEntry(entry))
                .append(
                    $("<span class=\"editor-swatch\"></span>").css("background", chooseAlignmentEntryColor(entry)),

        function isTextEditingTarget(event) {
            return event.target.isContentEditable
                || $(event.target).is("textarea, input:not([type=button], [type=checkbox], [type=radio], [type=color], [type=range])");
        }

        function onUndoShortcut(event) {
            const isUndoShortcut = (event.ctrlKey || event.metaKey) && !event.shiftKey && !event.altKey && event.key.toLowerCase() === "z";
            if (!isUndoShortcut || isTextEditingTarget(event) || cadTool.isDrawing || viewer.cubatureTool.anyInsertionActive()) {
                return;
            }
            event.preventDefault();
            undoLastChange();
        }

        function undoLastChange() {

        function scheduleFeatureViewRender() {
            if (isFeatureViewRenderScheduled) {
                return;
            }
            isFeatureViewRenderScheduled = true;
            queueMicrotask(() => {
                isFeatureViewRenderScheduled = false;
                featureViewRenderers.forEach((render) => render());
            });
        }

        function formatNumber(value, fractionDigits) {
            return value.toLocaleString("cs-CZ", { minimumFractionDigits: fractionDigits, maximumFractionDigits: fractionDigits });
        }

        function describeFeature(feature) {
            const isRectangle = feature.featureType === Potree.UtilityNetworkEditor.CadFeatureType.POLYGON
                && Potree.UtilityNetworkEditor.measureFeature(feature, null).rectangleSides !== null;
            const typeTitle = isRectangle ? "Obdélník" : featureTypeTitles[feature.featureType];
            return feature.label !== "" ? `${typeTitle} „${feature.label}“` : typeTitle;
        }

        function formatSignedNumber(value, fractionDigits) {
            const roundedValue = Number(value.toFixed(fractionDigits)) || 0;
            return `${roundedValue > 0 ? "+" : ""}${formatNumber(roundedValue, fractionDigits)}`;
        }

        function describeArea(measurement) {
            return measurement.area === null ? "plochu nelze spočítat, hrany se kříží" : `plocha ${formatNumber(measurement.area, 1)} m²`;
        }

        function describeFeatureSummary(feature) {
            const measurement = Potree.UtilityNetworkEditor.measureFeature(feature, terrainHeightSampler);
            if (feature.featureType === Potree.UtilityNetworkEditor.CadFeatureType.POINT) {
                return `výška ${formatNumber(measurement.height, 2)} m`;
            }
            if (feature.featureType === Potree.UtilityNetworkEditor.CadFeatureType.POLYGON) {
                return measurement.area === null ? "kříží se" : `${formatNumber(measurement.area, 1)} m²`;
            }
            if (feature.featureType === Potree.UtilityNetworkEditor.CadFeatureType.CIRCLE) {
                return `r ${formatNumber(measurement.radius, 2)} m`;
            }
            return `${formatNumber(measurement.length, 2)} m`;
        }

        function describeFeatureMeasurement(feature) {
            const measurement = Potree.UtilityNetworkEditor.measureFeature(feature, terrainHeightSampler);
            if (feature.featureType === Potree.UtilityNetworkEditor.CadFeatureType.POINT) {
                return `Y ${formatNumber(measurement.coordinateY, 2)}, X ${formatNumber(measurement.coordinateX, 2)}, výška ${formatNumber(measurement.height, 2)} m`;
            }
            if (feature.featureType === Potree.UtilityNetworkEditor.CadFeatureType.POLYGON) {
                const sidesText = measurement.rectangleSides
                    ? `rozměry ${measurement.rectangleSides.map((side) => formatNumber(side, 2)).join(" × ")} m, `
                    : "";
                return `${sidesText}${describeArea(measurement)}, obvod ${formatNumber(measurement.perimeter, 2)} m`;
            }
            if (feature.featureType === Potree.UtilityNetworkEditor.CadFeatureType.CIRCLE) {
                return `poloměr ${formatNumber(measurement.radius, 2)} m, průměr ${formatNumber(measurement.diameter, 2)} m, `
                    + `obvod ${formatNumber(measurement.circumference, 2)} m, plocha ${formatNumber(measurement.area, 1)} m²`;
            }
            const slopeText = measurement.slopePercent === null ? "" : ` (spád ${formatSignedNumber(measurement.slopePercent, 1)} %)`;
            return `${formatNumber(measurement.length, 2)} m, převýšení ${formatSignedNumber(measurement.heightDifference, 2)} m${slopeText}`;
        }

        function flyToTarget(target, size) {
            const distance = Math.max(size * 1.5, flyToMinimumDistanceMetres);
            const yaw = viewer.scene.view.yaw;
            const pitch = Math.min(viewer.scene.view.pitch, flyToMaximumPitch);
            const position = [
                target[0] + Math.sin(yaw) * Math.cos(pitch) * distance,
                target[1] - Math.cos(yaw) * Math.cos(pitch) * distance,
                target[2] - Math.sin(pitch) * distance
            ];
            viewer.scene.view.setView(position, target, flyToDurationMilliseconds);
        }

        function flyToFeature(feature) {
            const minimum = feature.points[0].clone();
            const maximum = feature.points[0].clone();
            for (const point of feature.points) {
                minimum.min(point);
                maximum.max(point);
            }
            const target = minimum.clone().add(maximum).multiplyScalar(0.5);
            flyToTarget(target.toArray(), minimum.distanceTo(maximum));
        }

        function focusFeature(feature) {
            if (cadTool.isDrawing) {
                cadTool.finishDrawing();
            }
            if (dtmInfoTool.active) {
                dtmInfoTool.deactivate();
            }
            cadDocument.setLayerVisible(feature.layerId, true);
            cadEditTool.select(feature);
            flyToFeature(feature);
        }

        function createDrawingFileName(prefix, extension) {
            const pointCloudName = viewer.scene.pointclouds[0]?.name ?? datasetName;
            return pointCloudName ? `${prefix}-${pointCloudName.replace(/\.[^.]+$/, "")}.${extension}` : `${prefix}.${extension}`;
        }

        function saveDrawing() {
            const content = JSON.stringify(Potree.UtilityNetworkEditor.createCadFile(cadDocument, alignmentExceptions), null, 2);
            const url = URL.createObjectURL(new Blob([content], { type: "application/json" }));
            $("<a></a>").attr({ href: url, download: createDrawingFileName("mereni", "json") })[0].click();
            setTimeout(() => URL.revokeObjectURL(url), 0);
        }

        function replaceDrawing(content) {
            if (cadTool.isDrawing) {
                cadTool.finishDrawing();
            }
            cadEditTool.select(null);
            featureProfile.clear();
            cadDocument.replaceContent(content);
            if (content.cadastreAlignmentExceptions) {
                alignmentExceptions.replace(content.cadastreAlignmentExceptions);
            }
            cadHistory.reset();
        }

        function showFileStatus(text) {
            $("#utility_network_editor_file_status").text(text);
        }

        async function loadDrawingFile(file) {
            if (file.size > maximumDrawingFileBytes) {
                showFileStatus(drawingFileErrorMessages[Potree.UtilityNetworkEditor.CadFileErrorCode.TOO_LARGE]);
                return;
            }
            if (cadDocument.features.length > 0 && !window.confirm("Načtení nahradí současná měření. Pokračovat?")) {
                return;
            }
            let content;
            try {
                content = Potree.UtilityNetworkEditor.parseCadFile(await file.text());
            } catch (error) {
                showFileStatus(drawingFileErrorMessages[error.code] ?? "Soubor se nepodařilo načíst.");
                return;
            }
            replaceDrawing(content);
            showFileStatus(`Načteno měření: ${content.features.length}, vrstev: ${content.layers.length}.`);
        }

        function createEmptyDrawingContent() {
            return { layers: [{ id: "layer-1", name: "Vrstva 1", visible: true }], activeLayerId: "layer-1", features: [] };
        }

        function startNewDrawing() {
            if (cadDocument.features.length > 0 && !window.confirm("Smažou se všechna měření i vrstvy. Pokračovat?")) {
                return;
            }
            const shownLayerCount = showConvertedDxfLayers();
            replaceDrawing(createEmptyDrawingContent());
            showFileStatus(shownLayerCount > 0 ? "Všechna měření jsou smazaná. Převzaté vrstvy výkresů DXF jsou zase vidět." : "Všechna měření jsou smazaná.");
        }

        function moveLegacyMeasurements() {
            try {
                const storage = window.localStorage;
                const legacyKeys = Object.keys(storage).filter((key) => key === legacyStoragePrefix || key.startsWith(`${legacyStoragePrefix}:`));
                for (const legacyKey of legacyKeys) {
                    const key = storagePrefix + legacyKey.slice(legacyStoragePrefix.length);
                    if (storage.getItem(key) === null) {
                        storage.setItem(key, storage.getItem(legacyKey));
                    }
                    storage.removeItem(legacyKey);
                }
            } catch {
                return;
            }
        }

        function restoreStoredDrawing() {
            try {
                const content = cadAutosave.load();
                if (content) {
                    replaceDrawing(content);
                    showFileStatus(`Obnoveno z prohlížeče: měření ${content.features.length}, vrstev ${content.layers.length}.`);
                }
            } catch (error) {
                showFileStatus(`Uložená měření se nepodařilo obnovit. ${drawingFileErrorMessages[error.code] ?? ""}`.trim());
            }
            cadAutosave.addEventListener("save_failed", () => showFileStatus("Automatické ukládání se nezdařilo: prohlížeč úložiště nepovolil, nebo je plné."));
            cadAutosave.start();
        }

        function updateEditToolAvailability() {
            cadEditTool.setEnabled(!cadTool.isDrawing && !dtmInfoTool.active && !buildingInfoTool.active && !cadastreMoveTool.active);
        }

        function formatDimension(dimension) {
            const dimensionFormats = {
                [Potree.UtilityNetworkEditor.DimensionKind.LENGTH]: (value) => `${formatNumber(value, 2)} m`,
                [Potree.UtilityNetworkEditor.DimensionKind.AREA]: (value) => `${formatNumber(value, 1)} m²`,
                [Potree.UtilityNetworkEditor.DimensionKind.RADIUS]: (value) => `r = ${formatNumber(value, 2)} m`,
                [Potree.UtilityNetworkEditor.DimensionKind.HEIGHT]: (value) => `v = ${formatNumber(value, 2)} m`
            };
            return dimensionFormats[dimension.kind](dimension.value);
        }

        function startTerrainHeightSampler(pointCloud) {
            terrainHeightSampler = new Potree.UtilityNetworkEditor.TerrainHeightSampler(pointCloud);
            const terrainStatus = $("#utility_network_editor_terrain_status");
            dtmOverlay.setTerrainHeightSampler(terrainHeightSampler);
            cadastreOverlay.setTerrainHeightSampler(terrainHeightSampler);
            cadEditTool.setTerrainHeightSampler(terrainHeightSampler);
            buildingExtrusionLayer.setTerrainHeightSampler(terrainHeightSampler);
            dxfOverlay.setTerrainHeightSampler(terrainHeightSampler);
            terrainHeightSampler.addEventListener("ready", () => {
                terrainStatus.text("Výška terénu z mračna: hotovo.");
                scheduleFeatureViewRender();
            });
            terrainHeightSampler.addEventListener("failed", () => terrainStatus.text("Výšku terénu se nepodařilo spočítat."));
            terrainStatus.text("Výška terénu z mračna: počítám…");
            terrainHeightSampler.start();
        }

        function translateProfileWindow() {
            for (const [translationKey, text] of Object.entries(profileWindowTexts)) {
                $(`#profile_window [data-i18n="${translationKey}"]`).removeAttr("data-i18n").text(text);
            }
        }

        function disconnectPotreeMapView() {
            viewer.scene.removeEventListener("pointcloud_added", viewer.mapView.onPointcloudAdded);
        }

        function createEditorInterface() {
            cadastreAlignment.setInterpolationEnabled(loadInterpolationEnabled());
            cadastreAlignment.setReference(loadAlignmentReference());
            cadastreAlignment.setDisplayMode(loadAlignmentDisplayMode());
            $("#potree_sidebar_container").append(createEditorPanel());
            $("#potree_render_area").append(
                createToolbar(),
                createDrawingHint(),
                createSelectionCard(),
                createScenePrompt(),
                $("<div id=\"utility_network_editor_attribution\" class=\"editor-floating\"></div>")
            );
            updatePointCloudControls(Boolean(datasetName));
            for (const eventType of ["feature_added", "feature_removed", "layers_changed", "feature_layer_changed"]) {
                cadDocument.addEventListener(eventType, scheduleFeatureViewRender);
            }
            for (const eventType of ["feature_changed", "selection_changed"]) {
                cadEditTool.addEventListener(eventType, scheduleFeatureViewRender);
            }
            scheduleFeatureViewRender();
            cadastreAlignment.update();
        }

        infoPanel.find(".utility-info-close").on("click", closeInfoPanel);
        dtmInfoTool.addEventListener("query_started", () => {
            isInfoPromptShown = false;
            showInfoMessage("Načítám informace o síti…");
        });
        dtmInfoTool.addEventListener("query_finished", (event) => showInfoResult(event.result));
        dtmInfoTool.addEventListener("query_failed", () => showInfoMessage("Dotaz na DTM se nezdařil."));
        cadTool.addEventListener("drawing_changed", updateEditToolAvailability);
        dtmInfoTool.addEventListener("activation_changed", updateEditToolAvailability);
        buildingInfoTool.addEventListener("activation_changed", updateEditToolAvailability);
        buildingInfoTool.addEventListener("building_picked", (event) => {
            isInfoPromptShown = false;
            showBuildingInfo(event.building);
        });
        cadastreAlignment.addEventListener("changed", updateExtrudedBuildings);
        dxfOverlay.addEventListener("documents_changed", storeHiddenDxfLayers);
        cadastreOverlay.addEventListener("layer_loaded", (event) => {
            if (event.layerId === Potree.UtilityNetworkEditor.CadastreLayer.BUILDINGS) {
                updateExtrudedBuildings();
            }
        });
        cadastreMoveTool.addEventListener("activation_changed", (event) => {
            updateEditToolAvailability();
            updateDrawingHint();
            if (!event.active) {
                requestCadastreViewCheck();
            }
        });
        viewer.addEventListener("update", watchViewForCadastre);
        cadastreMoveTool.addEventListener("step_changed", showMoveStep);
        cadEditTool.addEventListener("feature_changed", () => cadHistory.capture());
        cadEditTool.addEventListener("selection_changed", () => cadHistory.capture());
        document.addEventListener("keydown", onUndoShortcut);

        const pointCloudLoaded = datasetName ? loadDatasetPointCloud(datasetName) : Promise.resolve(null);
        await viewer.loadGUI();
        disconnectPotreeMapView();
        viewer.setLanguage("cs");
        translateProfileWindow();
        viewer.toggleSidebar();
        createEditorInterface();
        restoreStoredDrawing();
        restoreDxfDocuments(cadAutosave.storageKey);
        renderStoredPointClouds();
        const pointCloud = await pointCloudLoaded;
        if (pointCloud) {
            replacePointCloud(pointCloud, datasetPointCloudAttributes);
        } else if (datasetName) {
            updatePointCloudControls(false);
            showPointCloudStatus(`Mračno „${datasetName}“ se nepodařilo načíst ze složky examples/data. Otevřete vlastní mračno.`);
        } else {
            await restoreLastStoredPointCloud();
        }
    </script>
</body>
</html>
