<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Síťový editor – PoC</title>

    <link rel="stylesheet" type="text/css" href="../build/potree/potree.css">
    <link rel="stylesheet" type="text/css" href="../libs/jquery-ui/jquery-ui.min.css">
    <link rel="stylesheet" type="text/css" href="../libs/openlayers3/ol.css">
    <link rel="stylesheet" type="text/css" href="../libs/spectrum/spectrum.css">
    <link rel="stylesheet" type="text/css" href="../libs/jstree/themes/mixed/style.css">
    <link rel="stylesheet" type="text/css" href="../libs/Cesium/Widgets/CesiumWidget/CesiumWidget.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
    <style>
        :root {
            --editor-panel: #1c2026;
            --editor-surface: #252a32;
            --editor-surface-hover: #2f3541;
            --editor-border: rgba(255, 255, 255, 0.1);
            --editor-border-strong: rgba(255, 255, 255, 0.24);
            --editor-text: #e6e8eb;
            --editor-muted: #98a2ad;
            --editor-accent: #4c9aff;
            --editor-accent-soft: rgba(76, 154, 255, 0.2);
            --editor-accent-strong: #3d87e6;
            --editor-danger: #ff7a7a;
            --editor-radius: 6px;
            --editor-font: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        }
        #sidebar_root {
            display: none;
        }
        #potree_sidebar_container {
            width: 300px;
            overflow-y: auto;
            border-right: 1px solid var(--editor-border);
            background: var(--editor-panel);
        }
        #utility_network_editor_panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px;
            color: var(--editor-text);
            font: 13px/1.4 var(--editor-font);
        }
        .editor-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 2px;
            font-size: 15px;
            font-weight: 600;
        }
        .editor-header .ti {
            color: var(--editor-accent);
            font-size: 20px;
        }
        .editor-tabs,
        .editor-segmented {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2px;
            padding: 3px;
            border-radius: 8px;
            background: var(--editor-surface);
        }
        .editor-tab,
        .editor-segment {
            padding: 5px 0;
            border: 0;
            border-radius: var(--editor-radius);
            background: none;
            color: var(--editor-muted);
            font: inherit;
            text-align: center;
            cursor: pointer;
        }
        .editor-tab:hover,
        .editor-segment:hover {
            color: var(--editor-text);
        }
        .editor-tab.is-active,
        .editor-segment:has(input:checked) {
            background: var(--editor-panel);
            color: var(--editor-text);
            box-shadow: 0 0 0 1px var(--editor-border);
        }
        .editor-segment input {
            display: none;
        }
        .editor-pane {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .editor-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 26px;
            margin-top: 6px;
            color: var(--editor-muted);
            font-size: 11px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .editor-note,
        .editor-status {
            color: var(--editor-muted);
            font-size: 11px;
        }
        .editor-note:empty {
            display: none;
        }
        .editor-status {
            white-space: nowrap;
        }
        .editor-row {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .editor-grow {
            flex: 1;
            min-width: 0;
        }
        .editor-button {
            display: inline-flex;
            flex: none;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 30px;
            padding: 0 10px;
            border: 1px solid var(--editor-border);
            border-radius: var(--editor-radius);
            background: var(--editor-surface);
            color: var(--editor-text);
            font: inherit;
            cursor: pointer;
        }
        .editor-button:hover:not(:disabled) {
            background: var(--editor-surface-hover);
        }
        .editor-button:disabled {
            opacity: 0.4;
            cursor: default;
        }
        .editor-button .ti {
            font-size: 17px;
        }
        .editor-icon-button {
            width: 30px;
            padding: 0;
        }
        .editor-button.is-active {
            border-color: var(--editor-accent);
            background: var(--editor-accent-soft);
        }
        .editor-button.is-danger {
            color: var(--editor-danger);
        }
        .editor-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
            cursor: pointer;
        }
        .editor-toggle span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #utility_network_editor_panel input[type=checkbox],
        #utility_network_editor_panel input[type=radio] {
            margin: 0;
            accent-color: var(--editor-accent);
        }
        .editor-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .editor-chip-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .editor-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border: 1px solid var(--editor-border);
            border-radius: 999px;
            color: var(--editor-muted);
            cursor: pointer;
            user-select: none;
        }
        .editor-chip input {
            display: none;
        }
        .editor-chip.is-on {
            border-color: var(--editor-border-strong);
            background: var(--editor-surface-hover);
            color: var(--editor-text);
        }
        .editor-chip:has(input:disabled) {
            opacity: 0.4;
            cursor: default;
        }
        .editor-chip:not(.is-on) .editor-dot {
            opacity: 0.35;
        }
        .editor-chip-status {
            color: var(--editor-muted);
            font-size: 11px;
        }
        .editor-dot,
        .editor-swatch {
            flex: none;
            width: 9px;
            height: 9px;
            border-radius: 50%;
        }
        .editor-swatch {
            width: 10px;
            height: 10px;
            border-radius: 3px;
        }
        .editor-details {
            padding: 6px 10px;
            border: 1px solid var(--editor-border);
            border-radius: 8px;
        }
        .editor-details summary {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--editor-muted);
            list-style: none;
            cursor: pointer;
        }
        .editor-details summary::-webkit-details-marker {
            display: none;
        }
        .editor-details[open] summary {
            color: var(--editor-text);
        }
        .editor-details > :not(summary) {
            margin-top: 10px;
        }
        .editor-details-chevron {
            margin-left: auto;
            font-size: 16px;
            transition: transform 0.15s;
        }
        .editor-details[open] .editor-details-chevron {
            transform: rotate(180deg);
        }
        .editor-empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 16px 12px;
            border: 1px dashed var(--editor-border-strong);
            border-radius: 8px;
            text-align: center;
        }
        .editor-empty-state > .ti,
        #utility_network_editor_scene_prompt > .ti {
            color: var(--editor-accent);
            font-size: 36px;
        }
        .editor-empty-title {
            font-size: 14px;
            font-weight: 600;
        }
        .editor-primary-button {
            height: 36px;
            padding: 0 16px;
            border-color: var(--editor-accent);
            background: var(--editor-accent);
            color: #fff;
            font-weight: 600;
        }
        .editor-primary-button:hover:not(:disabled) {
            background: var(--editor-accent-strong);
        }
        .editor-reopen-button {
            max-width: 100%;
        }
        .editor-reopen-button span {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #utility_network_editor_scene_prompt {
            top: 50%;
            left: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            max-width: calc(100% - 40px);
            padding: 20px 28px;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .editor-range {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 2px 8px;
        }
        .editor-range input {
            grid-column: 1 / -1;
            width: 100%;
            accent-color: var(--editor-accent);
        }
        .editor-range-value {
            color: var(--editor-muted);
        }
        .editor-list-row {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 30px;
            padding: 2px 6px;
            border-radius: var(--editor-radius);
        }
        .editor-list-row:hover {
            background: var(--editor-surface);
        }
        .editor-feature {
            cursor: pointer;
        }
        .editor-feature.is-active {
            background: var(--editor-accent-soft);
        }
        .editor-list-title {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .editor-list-value {
            color: var(--editor-muted);
            font-size: 12px;
            white-space: nowrap;
        }
        .editor-group-title {
            margin-top: 4px;
            color: var(--editor-muted);
            font-size: 11px;
        }
        .editor-stack {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .editor-stack .editor-button {
            justify-content: flex-start;
        }
        .editor-floating {
            position: absolute;
            z-index: 5000;
            box-sizing: border-box;
            border: 1px solid var(--editor-border);
            border-radius: 10px;
            background: rgba(28, 32, 38, 0.94);
            color: var(--editor-text);
            font: 13px/1.4 var(--editor-font);
        }
        #utility_network_editor_toolbar {
            top: 10px;
            left: 50%;
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 4px;
            transform: translateX(-50%);
        }
        #utility_network_editor_toolbar .editor-button {
            border-color: transparent;
            background: none;
        }
        #utility_network_editor_toolbar .editor-button:hover:not(:disabled) {
            background: var(--editor-surface-hover);
        }
        #utility_network_editor_toolbar .editor-button.is-active {
            border-color: var(--editor-accent);
            background: var(--editor-accent-soft);
        }
        #utility_network_editor_toolbar input[type=color] {
            width: 30px;
            height: 26px;
            padding: 0 2px;
            border: 0;
            background: none;
            cursor: pointer;
        }
        .editor-separator {
            align-self: stretch;
            width: 1px;
            margin: 4px;
            background: var(--editor-border);
        }
        #utility_network_editor_hint {
            top: 58px;
            left: 50%;
            max-width: clamp(240px, calc(100% - 672px), 560px);
            padding: 8px 12px;
            font-size: 12px;
            transform: translateX(-50%);
        }
        #utility_network_editor_selection_card {
            top: 56px;
            left: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 300px;
            max-height: calc(100% - 68px);
            overflow-y: auto;
            padding: 10px 12px;
        }
        .editor-card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }
        .editor-card-measurement {
            color: var(--editor-muted);
            font-size: 12px;
        }
        .editor-card-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .editor-field {
            display: grid;
            grid-template-columns: 64px 1fr;
            align-items: center;
            gap: 8px;
        }
        .editor-field label {
            color: var(--editor-muted);
        }
        .editor-field input[type=text],
        .editor-field select {
            height: 28px;
            padding: 0 8px;
            border: 1px solid var(--editor-border);
            border-radius: var(--editor-radius);
            background: var(--editor-surface);
            color: var(--editor-text);
            font: inherit;
        }
        .editor-field input[type=color] {
            width: 40px;
            height: 26px;
            padding: 0;
            border: 0;
            background: none;
        }
        #utility_network_editor_attribution {
            right: 8px;
            bottom: 6px;
            padding: 2px 8px;
            border: 0;
            border-radius: 6px;
            background: rgba(28, 32, 38, 0.7);
            color: var(--editor-muted);
            font-size: 11px;
        }
        #utility_info_panel {
            display: none;
            position: absolute;
            top: 60px;
            right: 10px;
            z-index: 10000;
            width: 340px;
            max-height: calc(100% - 90px);
            overflow-y: auto;
            padding: 10px 12px;
            border: 1px solid var(--editor-border);
            border-radius: 10px;
            background: rgba(28, 32, 38, 0.94);
            color: var(--editor-text);
            font: 12px/1.4 var(--editor-font);
        }
        #utility_info_panel .utility-info-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
        }
        #utility_info_panel .utility-info-close {
            border: none;
            background: none;
            color: var(--editor-text);
            font-size: 18px;
            cursor: pointer;
        }
        #utility_info_panel .utility-info-feature {
            padding: 6px 0;
            border-top: 1px solid var(--editor-border);
        }
        #utility_info_panel .utility-info-title {
            margin-bottom: 2px;
            color: #ffcc66;
            font-weight: 600;
        }
        #utility_info_panel table {
            width: 100%;
            border-collapse: collapse;
        }
        #utility_info_panel td {
            padding: 1px 4px 1px 0;
            vertical-align: top;
        }
        #utility_info_panel td:first-child {
            width: 45%;
            color: var(--editor-muted);
        }
        #utility_info_panel .utility-info-footer {
            margin-top: 6px;
            color: var(--editor-muted);
            font-size: 11px;
        }
    </style>
</head>

<body>
    <script src="../libs/jquery/jquery-3.1.1.min.js"></script>
    <script src="../libs/spectrum/spectrum.js"></script>
    <script src="../libs/jquery-ui/jquery-ui.min.js"></script>
    <script src="../libs/other/BinaryHeap.js"></script>
    <script src="../libs/tween/tween.min.js"></script>
    <script src="../libs/d3/d3.js"></script>
    <script src="../libs/proj4/proj4.js"></script>
    <script src="../libs/openlayers3/ol.js"></script>
    <script src="../libs/i18next/i18next.js"></script>
    <script src="../libs/jstree/jstree.js"></script>
    <script src="../build/potree/potree.js"></script>
    <script src="../libs/plasio/js/laslaz.js"></script>
    <script src="../libs/Cesium/Cesium.js"></script>
    <script src="../libs/copc/index.js"></script>

    <div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px;">
        <div id="potree_render_area" style="background-color: #102030;">
            <div id="cesiumContainer" style="position: absolute; inset: 0; background-color: #102030"></div>
        </div>
        <div id="potree_sidebar_container"></div>
    </div>

    <div id="utility_info_panel">
        <div class="utility-info-header">
            <span>Info o síti</span>
            <button class="utility-info-close" type="button" title="Zavřít">×</button>
        </div>
        <div class="utility-info-body"></div>
        <div class="utility-info-footer">Zdroj: ČÚZK – IS DMVS (DTM krajů). Přibližný zákres, pouze orientačně.</div>
    </div>

    <script type="module">
        const requestedDatasetName = new URLSearchParams(window.location.search).get("data") ?? "";
        const datasetName = requestedDatasetName.replace(/[^a-zA-Z0-9_-]/g, "");

        const dtmPropertyLabels = {
            nazevvlastnika: "Vlastník",
            nazevspravce: "Správce",
            nazevprovozovatele: "Provozovatel",
            urovenumisteniobjektuti: "Úroveň umístění",
            tridapresnostipoloha: "Třída přesnosti polohy",
            tridapresnostivyska: "Třída přesnosti výšky",
            zpusobporizeniti: "Způsob pořízení",
            maximalninapetovahladina: "Napěťová hladina",
            doplnek: "Doplněk",
            datumvkladu: "Datum vkladu",
            datumzmeny: "Datum změny",
            neuplnadata: "Neúplná data"
        };

        const viewer = new Potree.Viewer(document.getElementById("potree_render_area"), {
            cesiumRenderArea: document.getElementById("cesiumContainer")
        });
        window.viewer = viewer;
        viewer.setEDLEnabled(false);
        viewer.setFOV(60);
        viewer.setPointBudget(5_000_000);
        viewer.setMinNodeSize(30);
        viewer.setBackground(null);
        viewer.useHQ = true;

        const mapPlane = new Potree.UtilityNetworkEditor.MapPlane(viewer);
        const dtmOverlay = new Potree.UtilityNetworkEditor.DtmOverlay(viewer, mapPlane);
        const surfacePicker = new Potree.UtilityNetworkEditor.SurfacePicker(viewer, mapPlane);
        const cadastreOverlay = new Potree.UtilityNetworkEditor.CadastreOverlay(viewer, mapPlane);
        const dtmInfoTool = new Potree.UtilityNetworkEditor.DtmInfoTool(viewer, mapPlane, dtmOverlay);
        const cadDocument = new Potree.UtilityNetworkEditor.CadDocument();
        const cadView = new Potree.UtilityNetworkEditor.CadView(viewer, cadDocument);
        const cadSnapper = new Potree.UtilityNetworkEditor.CadSnapper(viewer, mapPlane, cadDocument, cadastreOverlay);
        surfacePicker.setSnapper(cadSnapper);
        const cadTool = new Potree.UtilityNetworkEditor.CadTool(viewer, surfacePicker, cadDocument, cadView);
        const cadEditTool = new Potree.UtilityNetworkEditor.CadEditTool(viewer, cadDocument, surfacePicker);
        const cadHistory = new Potree.UtilityNetworkEditor.CadHistory(cadDocument);
        const featureProfile = new Potree.UtilityNetworkEditor.FeatureProfile(viewer);
        const storagePrefix = "oidis-utility-network-editor";
        const legacyStoragePrefix = "oidis-network-editor";
        const autosaveKey = datasetName ? `${storagePrefix}:${datasetName}` : storagePrefix;
        moveLegacyMeasurements();
        const cadAutosave = new Potree.UtilityNetworkEditor.CadAutosave(cadDocument, cadHistory, autosaveKey);
        const recentPointCloudStore = new Potree.UtilityNetworkEditor.RecentFileStore(storagePrefix, "last-point-cloud");
        const lasPickerOptions = { types: [{ description: "Mračno bodů LAS", accept: { "application/octet-stream": [".las", ".laz"] } }] };
        cadView.setDimensionFormatter((dimension) => formatDimension(dimension));
        cadDocument.addLayer("Vrstva 1");

        const maximumLasPointCount = 20000000;
        const lasErrorMessages = {
            [Potree.UtilityNetworkEditor.LasReadErrorCode.NOT_LAS]: "Soubor není mračno ve formátu LAS.",
            [Potree.UtilityNetworkEditor.LasReadErrorCode.COMPRESSED]: "Komprimovaný LAZ zatím neumíme načíst, použijte nekomprimovaný LAS.",
            [Potree.UtilityNetworkEditor.LasReadErrorCode.UNSUPPORTED_FORMAT]: "Tento formát bodů v LAS neumíme načíst.",
            [Potree.UtilityNetworkEditor.LasReadErrorCode.EMPTY]: "Soubor neobsahuje body, nebo je poškozený."
        };
        const maximumDrawingFileBytes = 20 * 1024 * 1024;
        const drawingFileErrorMessages = {
            [Potree.UtilityNetworkEditor.CadFileErrorCode.TOO_LARGE]: "Soubor je příliš velký (max. 20 MB).",
            [Potree.UtilityNetworkEditor.CadFileErrorCode.INVALID_JSON]: "Soubor není platný JSON.",
            [Potree.UtilityNetworkEditor.CadFileErrorCode.UNSUPPORTED_FORMAT]: "Soubor neobsahuje měření ze síťového editoru, nebo má jinou verzi či souřadnicový systém.",
            [Potree.UtilityNetworkEditor.CadFileErrorCode.INVALID_CONTENT]: "Soubor s měřeními obsahuje neplatná data."
        };
        const flyToMinimumDistanceMetres = 40;
        const flyToMaximumPitch = -Math.PI / 4;
        const flyToDurationMilliseconds = 800;
        const featureViewRenderers = [];
        let isFeatureViewRenderScheduled = false;
        let isDrawingHelpShown = false;
        let terrainHeightSampler = null;
        let pointSize = 1;
        let selectedBaseMapProvider = "orto";
        let isMapStarted = false;
        let recentPointCloudHandle = null;

        const cadastreExtentMetres = 1500;
        const cadastreLayers = [
            { layerId: Potree.UtilityNetworkEditor.CadastreLayer.PARCELS, title: "Parcely", description: "Parcely (RÚIAN)" },
            { layerId: Potree.UtilityNetworkEditor.CadastreLayer.BUILDINGS, title: "Budovy", description: "Budovy (RÚIAN)" },
            { layerId: Potree.UtilityNetworkEditor.CadastreLayer.ROADS, title: "Cesty", description: "Cesty (ZABAGED, orientační)" }
        ];
        const loadedCadastreLayers = new Set();

        const drawingHelp = "Pohled: levé tlačítko otáčí, pravé posouvá, kolečko přibližuje. "
            + "Kreslení: vyberte nástroj v liště a klikejte do mapy, Esc kreslení ukončí. Žlutý čtvereček ukazuje přichycení. "
            + "Úpravy: klikněte na prvek, tažením vrcholu ho upravíte, tažením za hranu nebo plochu posunete celý prvek, "
            + "kliknutím na hranu přidáte vrchol. U kružnice tažením středu posunete kružnici a tažením bodu na obvodu změníte poloměr. "
            + "Delete smaže vybraný vrchol, jinak celý prvek. Esc zruší výběr, Ctrl+Z vrátí poslední změnu.";
        const baseMaps = [
            { provider: "orto", title: "Ortofoto ČÚZK", shortTitle: "Orto", attribution: "Mapa © ČÚZK, CC BY 4.0" },
            { provider: "cuzk", title: "Základní mapa ČÚZK", shortTitle: "Mapa", attribution: "Mapa © ČÚZK, CC BY 4.0" },
            { provider: "openStreetMap", title: "OpenStreetMap", shortTitle: "OSM", attribution: "Mapa © OpenStreetMap contributors" },
            { provider: null, title: "Bez mapy", shortTitle: "Žádná", attribution: "" }
        ];
        const vertexDeleteRefusedHint = "Vrchol nejde smazat: délka potřebuje aspoň 2 vrcholy, polygon 3 a kružnice má vždy střed "

        async function loadPointCloud(name) {

            if (!response?.ok) {
                return null;
            }
            return new Promise((resolve) => {

            });

        function addPointCloud(pointCloud) {
            const material = pointCloud.material;
            const pointCloudCheckbox = $("#utility_network_editor_point_cloud");
            material.activeAttributeName = "rgba";
            material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
            material.size = pointSize;
            material.minSize = 2;
            pointCloud.visible = pointCloudCheckbox.prop("checked");
            pointCloud.addEventListener("visibility_changed", () => pointCloudCheckbox.prop("checked", pointCloud.visible));
            viewer.scene.addPointCloud(pointCloud);
            viewer.fitToScreen();
        }

        function setPointCloudsVisible(visible) {
            for (const pointCloud of viewer.scene.pointclouds) {
                pointCloud.visible = visible;
            }

        function setPointSize(size) {
            pointSize = size;
            for (const pointCloud of viewer.scene.pointclouds) {
                pointCloud.material.size = size;
            }
        }

        function setBaseMap(provider) {
            selectedBaseMapProvider = provider;
            viewer.cesiumRender.init();
            viewer.setShowCesium(provider !== null);
            $("#show_cesium").prop("checked", provider !== null);
            if (provider !== null) {
                $("#show_cesium_map_provider input[type=checkbox]").each((index, element) => {
                    element.checked = element.value === provider;
                });
                $(`#show_cesium_map_provider input[value=${provider}]`).trigger("change");
            }
            updateAttribution();
        }

        function startMapAndUtilities() {
            if (isMapStarted) {
                return;

            isMapStarted = true;
            setBaseMap(selectedBaseMapProvider);
            dtmOverlay.setVisible($("#utility_network_editor_dtm").prop("checked"));
        }

        function updateAttribution() {
            const baseMap = baseMaps.find((map) => map.provider === selectedBaseMapProvider);
            const isCadastreShown = cadastreLayers.some((cadastreLayer) => $(`#utility_network_editor_cadastre_${cadastreLayer.layerId}`).prop("checked"));
            const parts = [
                baseMap?.attribution ?? "",
                isCadastreShown ? "Katastr © ČÚZK, CC BY 4.0" : "",
                $("#utility_network_editor_dtm").prop("checked") ? "Sítě: ČÚZK – IS DMVS, orientační" : ""
            ].filter((part) => part !== "");
            $("#utility_network_editor_attribution").text(parts.join(" · ")).toggle(parts.length > 0);
        }

        function formatPropertyValue(value) {
            if (typeof value === "boolean") {
                return value ? "ano" : "ne";
            }
            return String(value);
        }

        function createFeatureElement(properties) {
            const title = $("<div class=\"utility-info-title\"></div>").text(properties.objektovytypnazev ?? "Objekt DTM");
            const table = $("<table></table>");
            for (const [key, label] of Object.entries(dtmPropertyLabels)) {
                const value = properties[key];
                if (value === null || value === undefined || value === "") {
                    continue;
                }
                table.append($("<tr></tr>").append($("<td></td>").text(label), $("<td></td>").text(formatPropertyValue(value))));
            }
            return $("<div class=\"utility-info-feature\"></div>").append(title, table);
        }

        function showInfoMessage(message) {
            infoPanelBody.empty().append($("<div></div>").text(message));
            infoPanel.show();
        }

        function showInfoResult(result) {
            if (result.features.length === 0) {
                showInfoMessage("V místě kliknutí není žádná síť.");
                return;
            }
            infoPanelBody.empty();
            if (result.region) {
                infoPanelBody.append($("<div class=\"editor-note\"></div>").text(`DTM: ${result.region}`));
            }
            for (const properties of result.features) {
                infoPanelBody.append(createFeatureElement(properties));
            }
            infoPanel.show();
        }

        function createIcon(iconName) {
            return $("<i aria-hidden=\"true\"></i>").addClass(`ti ti-${iconName}`);

        function createButton(options) {
            const button = $("<button type=\"button\" class=\"editor-button\"></button>")
                .attr("title", options.title)
                .append(createIcon(options.icon))
                .on("click", options.onClick);
            if (options.text) {
                button.append($("<span></span>").text(options.text));
            } else {
                button.addClass("editor-icon-button").attr("aria-label", options.title);
            }
            if (options.identifier) {
                button.attr("id", options.identifier);
            }
            return button;
        }

        function createToggleButton(options) {
            const button = createButton({
                ...options,
                onClick: () => {
                    const isOn = button.attr("aria-pressed") !== "true";
                    setToggleButtonState(button, isOn);
                    options.onToggle(isOn);
                }
            });
            setToggleButtonState(button, options.isOn);
            return button;
        }

        function setToggleButtonState(button, isOn) {
            button.attr("aria-pressed", String(isOn)).toggleClass("is-active", isOn);
        }

        function createToggle(identifier, text, checked, onChange) {
            const checkbox = $("<input type=\"checkbox\">")
                .attr("id", identifier)
                .prop("checked", checked)
                .on("change", (event) => onChange(event.target.checked));
            return $("<label class=\"editor-toggle\"></label>").attr("for", identifier).append(checkbox, $("<span></span>").text(text));
        }

        function createChip(options) {
            const checkbox = $("<input type=\"checkbox\">").attr("id", options.identifier).prop("checked", options.checked);
            const chip = $("<label class=\"editor-chip\"></label>").attr({ for: options.identifier, title: options.description ?? options.text });
            const updateChip = () => chip.toggleClass("is-on", checkbox.prop("checked"));
            checkbox.on("change", (event) => {
                updateChip();
                options.onChange(event.target.checked);
            });
            if (options.color) {
                chip.append($("<span class=\"editor-dot\"></span>").css("background", options.color));
            }
            chip.append(checkbox, $("<span></span>").text(options.text));
            updateChip();
            return chip;
        }

        function createSegmentedControl(name, options, selectedIndex, onSelect) {
            const control = $("<div class=\"editor-segmented\" role=\"radiogroup\"></div>");
            options.forEach((option, index) => {
                const identifier = `${name}_${index}`;
                const radio = $("<input type=\"radio\">")
                    .attr({ id: identifier, name: name })
                    .prop("checked", index === selectedIndex)
                    .on("change", () => onSelect(option));
                control.append($("<label class=\"editor-segment\"></label>").attr({ for: identifier, title: option.title }).append(radio, $("<span></span>").text(option.shortTitle)));
            });
            return control;
        }

        function createLabel(text, actions = []) {
            return $("<div class=\"editor-label\"></div>").append($("<span></span>").text(text), ...actions);
        }

        function createNote(text, identifier = null) {
            const note = $("<div class=\"editor-note\"></div>").text(text);
            return identifier ? note.attr("id", identifier) : note;
        }

        function createRange(options) {
            const output = $("<span class=\"editor-range-value\"></span>").text(options.formatValue(options.value));
            const input = $("<input type=\"range\">")
                .attr({ id: options.identifier, min: options.minimum, max: options.maximum, step: options.step })
                .val(options.value)
                .on("input", (event) => {
                    const value = Number(event.target.value);
                    output.text(options.formatValue(value));
                    options.onChange(value);
                });
            return $("<div class=\"editor-range\"></div>").append($("<label></label>").attr("for", options.identifier).text(options.title), output, input);
        }

        function showPointCloudStatus(text) {
            $("#utility_network_editor_point_cloud_status").text(text);
        }

        function describeLasProgress(progress) {
            const percent = Math.round(progress.share * 100);
            return progress.stage === Potree.UtilityNetworkEditor.LasLoadStage.READING ? `Čtu soubor… ${percent} %` : `Stavím mračno… ${percent} %`;
        }

        function disposePointCloud(pointCloud) {
            const pendingNodes = [pointCloud.pcoGeometry.root];
            while (pendingNodes.length > 0) {
                const node = pendingNodes.pop();
                node.geometry?.dispose();
                pendingNodes.push(...Object.values(node.children ?? {}).filter(Boolean));
            }
        }

        function looksLikeKrovakCoordinates(origin) {
            return origin[0] < -300000 && origin[0] > -950000 && origin[1] < -900000 && origin[1] > -1350000;
        }

        function removePointCloud(pointCloud) {
            const pointClouds = viewer.scene.pointclouds;
            pointClouds.splice(pointClouds.indexOf(pointCloud), 1);
            viewer.scene.scenePointCloud.remove(pointCloud);
        }

        function replacePointCloud(pointCloud) {
            for (const previousPointCloud of [...viewer.scene.pointclouds]) {
                removePointCloud(previousPointCloud);
                disposePointCloud(previousPointCloud);
            }
            addPointCloud(pointCloud);
            startTerrainHeightSampler(pointCloud);
            startMapAndUtilities();
            updatePointCloudControls(true);
        }

        async function openLasFile(file) {
            showPointCloudStatus(describeLasProgress({ stage: Potree.UtilityNetworkEditor.LasLoadStage.READING, share: 0 }));
            let result;
            try {
                result = await Potree.UtilityNetworkEditor.loadLasPointCloud(file, maximumLasPointCount, (progress) => showPointCloudStatus(describeLasProgress(progress)));
            } catch (error) {
                showPointCloudStatus(lasErrorMessages[error.code] ?? "Mračno se nepodařilo načíst.");
                return false;
            }
            result.pointCloud.setName(file.name);
            replacePointCloud(result.pointCloud);
            if (!result.hasColors) {
                result.pointCloud.material.activeAttributeName = "elevation";
            }
            $("#utility_network_editor_point_cloud_name").text(file.name);
            const thinnedText = result.pointCount < result.sourcePointCount ? `, zředěno z ${formatNumber(result.sourcePointCount, 0)}` : "";
            const coordinateText = looksLikeKrovakCoordinates(result.origin) ? "" : " Souřadnice nevypadají jako S-JTSK (EPSG:5514), mapa, DTM a katastr nemusí sedět.";
            showPointCloudStatus(`Načteno bodů ${formatNumber(result.pointCount, 0)}${thinnedText}.${coordinateText}`);
            return true;
        }

        async function chooseLasFile() {
            if (!Potree.UtilityNetworkEditor.RecentFileStore.isSupported()) {
                $("#utility_network_editor_las_input")[0].click();
                return;
            }
            let fileHandles;
            try {
                fileHandles = await window.showOpenFilePicker(lasPickerOptions);
            } catch {
                return;
            }
            if (await openLasFile(await fileHandles[0].getFile())) {
                rememberPointCloudFile(fileHandles[0]);
            }
        }

        function rememberPointCloudFile(fileHandle) {
            recentPointCloudHandle = fileHandle;
            recentPointCloudStore.save(fileHandle).catch(() => null);
            updateRecentPointCloudButtons();
        }

        function forgetRecentPointCloud() {
            recentPointCloudHandle = null;
            recentPointCloudStore.clear().catch(() => null);
            updateRecentPointCloudButtons();
        }

        function updateRecentPointCloudButtons() {
            const hasRecentPointCloud = recentPointCloudHandle !== null;
            $(".editor-reopen-button").toggle(hasRecentPointCloud)
                .find("span").text(hasRecentPointCloud ? `Znovu otevřít ${recentPointCloudHandle.name}` : "");
            $(".editor-open-las-button").toggleClass("editor-primary-button", !hasRecentPointCloud);
        }

        async function reopenRecentPointCloud() {
            const fileHandle = recentPointCloudHandle;
            let file;
            try {
                file = await Potree.UtilityNetworkEditor.readFileFromHandle(fileHandle, true);
            } catch {
                forgetRecentPointCloud();
                showPointCloudStatus(`Soubor ${fileHandle.name} už nejde otevřít, nejspíš byl přesunut nebo smazán. Otevřete mračno znovu.`);
                return;
            }
            if (!file) {
                showPointCloudStatus("Prohlížeč nepovolil přístup k souboru. Otevřete mračno přes tlačítko Otevřít mračno (LAS).");
                return;
            }
            await openLasFile(file);
        }

        async function restoreRecentPointCloud() {
            if (!Potree.UtilityNetworkEditor.RecentFileStore.isSupported()) {
                return;
            }
            const fileHandle = await recentPointCloudStore.load().catch(() => null);
            if (!fileHandle) {
                return;
            }
            recentPointCloudHandle = fileHandle;
            updateRecentPointCloudButtons();
            const file = await Potree.UtilityNetworkEditor.readFileFromHandle(fileHandle, false).catch(() => null);
            if (file) {
                await openLasFile(file);
            }
        }

        function loadCadastreLayer(layerId) {
            const extent = mapPlane.computeViewExtent(cadastreExtentMetres);
            if (!extent) {
                cadastreOverlay.dispatchEvent({ type: "layer_failed", layerId: layerId });
                return;
            }
            loadedCadastreLayers.add(layerId);
            cadastreOverlay.loadLayer(layerId, extent);
        }

        function onCadastreLayerToggled(layerId, checked) {
            if (checked && !loadedCadastreLayers.has(layerId)) {
                loadCadastreLayer(layerId);
            }
            cadastreOverlay.setLayerVisible(layerId, checked);
            updateAttribution();
        }

        function createCadastreChip(cadastreLayer) {
            const chip = createChip({
                identifier: `utility_network_editor_cadastre_${cadastreLayer.layerId}`,
                text: cadastreLayer.title,
                description: cadastreLayer.description,
                checked: false,
                onChange: (checked) => onCadastreLayerToggled(cadastreLayer.layerId, checked)
            });
            const status = $("<span class=\"editor-chip-status\" title=\"Počet načtených čar\"></span>");
            const isThisLayer = (event) => event.layerId === cadastreLayer.layerId;
            cadastreOverlay.addEventListener("layer_loading", (event) => isThisLayer(event) && status.text("…"));
            cadastreOverlay.addEventListener("layer_loaded", (event) => isThisLayer(event) && status.text(event.isTruncated ? `${event.lineCount}+` : String(event.lineCount)));
            cadastreOverlay.addEventListener("layer_failed", (event) => isThisLayer(event) && status.text("chyba"));
            return chip.append(status);
        }

            for (const cadastreLayer of cadastreLayers) {

            const button = createButton({

                identifier: "utility_network_editor_info_tool",

        function isTextEditingTarget(event) {
            return event.target.isContentEditable
                || $(event.target).is("textarea, input:not([type=button], [type=checkbox], [type=radio], [type=color], [type=range])");
        }

        function onUndoShortcut(event) {
            const isUndoShortcut = (event.ctrlKey || event.metaKey) && !event.shiftKey && !event.altKey && event.key.toLowerCase() === "z";
            if (!isUndoShortcut || isTextEditingTarget(event) || cadTool.isDrawing || viewer.cubatureTool.anyInsertionActive()) {
                return;
            }
            event.preventDefault();
            cadHistory.undo();
        }

        function scheduleFeatureViewRender() {
            if (isFeatureViewRenderScheduled) {
                return;
            }
            isFeatureViewRenderScheduled = true;
            queueMicrotask(() => {
                isFeatureViewRenderScheduled = false;
                featureViewRenderers.forEach((render) => render());
            });
        }

        function formatNumber(value, fractionDigits) {
            return value.toLocaleString("cs-CZ", { minimumFractionDigits: fractionDigits, maximumFractionDigits: fractionDigits });
        }

        function describeFeature(feature) {
            const isRectangle = feature.featureType === Potree.UtilityNetworkEditor.CadFeatureType.POLYGON
                && Potree.UtilityNetworkEditor.measureFeature(feature, null).rectangleSides !== null;
            const typeTitle = isRectangle ? "Obdélník" : featureTypeTitles[feature.featureType];
            return feature.label !== "" ? `${typeTitle} „${feature.label}“` : typeTitle;
        }

        function formatSignedNumber(value, fractionDigits) {
            const roundedValue = Number(value.toFixed(fractionDigits)) || 0;
            return `${roundedValue > 0 ? "+" : ""}${formatNumber(roundedValue, fractionDigits)}`;
        }

        function describeArea(measurement) {
            return measurement.area === null ? "plochu nelze spočítat, hrany se kříží" : `plocha ${formatNumber(measurement.area, 1)} m²`;
        }

        function describeFeatureSummary(feature) {
            const measurement = Potree.UtilityNetworkEditor.measureFeature(feature, terrainHeightSampler);
            if (feature.featureType === Potree.UtilityNetworkEditor.CadFeatureType.POINT) {
                return `výška ${formatNumber(measurement.height, 2)} m`;
            }
            if (feature.featureType === Potree.UtilityNetworkEditor.CadFeatureType.POLYGON) {
                return measurement.area === null ? "kříží se" : `${formatNumber(measurement.area, 1)} m²`;
            }
            if (feature.featureType === Potree.UtilityNetworkEditor.CadFeatureType.CIRCLE) {
                return `r ${formatNumber(measurement.radius, 2)} m`;
            }
            return `${formatNumber(measurement.length, 2)} m`;
        }

        function describeFeatureMeasurement(feature) {
            const measurement = Potree.UtilityNetworkEditor.measureFeature(feature, terrainHeightSampler);
            if (feature.featureType === Potree.UtilityNetworkEditor.CadFeatureType.POINT) {
                return `Y ${formatNumber(measurement.coordinateY, 2)}, X ${formatNumber(measurement.coordinateX, 2)}, výška ${formatNumber(measurement.height, 2)} m`;
            }
            if (feature.featureType === Potree.UtilityNetworkEditor.CadFeatureType.POLYGON) {
                const sidesText = measurement.rectangleSides
                    ? `rozměry ${measurement.rectangleSides.map((side) => formatNumber(side, 2)).join(" × ")} m, `
                    : "";
                return `${sidesText}${describeArea(measurement)}, obvod ${formatNumber(measurement.perimeter, 2)} m`;
            }
            if (feature.featureType === Potree.UtilityNetworkEditor.CadFeatureType.CIRCLE) {
                return `poloměr ${formatNumber(measurement.radius, 2)} m, průměr ${formatNumber(measurement.diameter, 2)} m, `
                    + `obvod ${formatNumber(measurement.circumference, 2)} m, plocha ${formatNumber(measurement.area, 1)} m²`;
            }
            const slopeText = measurement.slopePercent === null ? "" : ` (spád ${formatSignedNumber(measurement.slopePercent, 1)} %)`;
            return `${formatNumber(measurement.length, 2)} m, převýšení ${formatSignedNumber(measurement.heightDifference, 2)} m${slopeText}`;
        }

        function flyToFeature(feature) {
            const minimum = feature.points[0].clone();
            const maximum = feature.points[0].clone();
            for (const point of feature.points) {
                minimum.min(point);
                maximum.max(point);
            }
            const target = minimum.clone().add(maximum).multiplyScalar(0.5);
            const distance = Math.max(minimum.distanceTo(maximum) * 1.5, flyToMinimumDistanceMetres);
            const yaw = viewer.scene.view.yaw;
            const pitch = Math.min(viewer.scene.view.pitch, flyToMaximumPitch);
            const position = [
                target.x + Math.sin(yaw) * Math.cos(pitch) * distance,
                target.y - Math.cos(yaw) * Math.cos(pitch) * distance,
                target.z - Math.sin(pitch) * distance
            ];
            viewer.scene.view.setView(position, target.toArray(), flyToDurationMilliseconds);
        }

        function focusFeature(feature) {
            if (cadTool.isDrawing) {
                cadTool.finishDrawing();
            }
            if (dtmInfoTool.active) {
                dtmInfoTool.deactivate();
            }
            cadDocument.setLayerVisible(feature.layerId, true);
            cadEditTool.select(feature);
            flyToFeature(feature);
        }

        function createMeasurementFileName() {
            const pointCloudName = viewer.scene.pointclouds[0]?.name ?? datasetName;
            return pointCloudName ? `mereni-${pointCloudName.replace(/\.la[sz]$/i, "")}.json` : "mereni.json";
        }

        function saveDrawing() {
            const content = JSON.stringify(Potree.UtilityNetworkEditor.createCadFile(cadDocument), null, 2);
            const url = URL.createObjectURL(new Blob([content], { type: "application/json" }));
            $("<a></a>").attr({ href: url, download: createMeasurementFileName() })[0].click();
            setTimeout(() => URL.revokeObjectURL(url), 0);
        }

        function replaceDrawing(content) {
            if (cadTool.isDrawing) {
                cadTool.finishDrawing();
            }
            cadEditTool.select(null);
            featureProfile.clear();
            cadDocument.replaceContent(content);
            cadHistory.reset();
        }

        function showFileStatus(text) {
            $("#utility_network_editor_file_status").text(text);
        }

        async function loadDrawingFile(file) {
            if (file.size > maximumDrawingFileBytes) {
                showFileStatus(drawingFileErrorMessages[Potree.UtilityNetworkEditor.CadFileErrorCode.TOO_LARGE]);
                return;
            }
            if (cadDocument.features.length > 0 && !window.confirm("Načtení nahradí současná měření. Pokračovat?")) {
                return;
            }
            let content;
            try {
                content = Potree.UtilityNetworkEditor.parseCadFile(await file.text());
            } catch (error) {
                showFileStatus(drawingFileErrorMessages[error.code] ?? "Soubor se nepodařilo načíst.");
                return;
            }
            replaceDrawing(content);
            showFileStatus(`Načteno měření: ${content.features.length}, vrstev: ${content.layers.length}.`);
        }

        function createEmptyDrawingContent() {
            return { layers: [{ id: "layer-1", name: "Vrstva 1", visible: true }], activeLayerId: "layer-1", features: [] };
        }

        function startNewDrawing() {
            if (cadDocument.features.length > 0 && !window.confirm("Smažou se všechna měření i vrstvy. Pokračovat?")) {
                return;
            }
            replaceDrawing(createEmptyDrawingContent());
            showFileStatus("Všechna měření jsou smazaná.");
        }

        function moveLegacyMeasurements() {
            try {
                const storage = window.localStorage;
                const legacyKeys = Object.keys(storage).filter((key) => key === legacyStoragePrefix || key.startsWith(`${legacyStoragePrefix}:`));
                for (const legacyKey of legacyKeys) {
                    const key = storagePrefix + legacyKey.slice(legacyStoragePrefix.length);
                    if (storage.getItem(key) === null) {
                        storage.setItem(key, storage.getItem(legacyKey));
                    }
                    storage.removeItem(legacyKey);
                }
            } catch {
                return;
            }
        }

        function restoreStoredDrawing() {
            try {
                const content = cadAutosave.load();
                if (content) {
                    replaceDrawing(content);
                    showFileStatus(`Obnoveno z prohlížeče: měření ${content.features.length}, vrstev ${content.layers.length}.`);
                }
            } catch (error) {
                showFileStatus(`Uložená měření se nepodařilo obnovit. ${drawingFileErrorMessages[error.code] ?? ""}`.trim());
            }
            cadAutosave.addEventListener("save_failed", () => showFileStatus("Automatické ukládání se nezdařilo: prohlížeč úložiště nepovolil, nebo je plné."));
            cadAutosave.start();
        }

        function updateEditToolAvailability() {
            cadEditTool.setEnabled(!cadTool.isDrawing && !dtmInfoTool.active);
        }

        function formatDimension(dimension) {
            const dimensionFormats = {
                [Potree.UtilityNetworkEditor.DimensionKind.LENGTH]: (value) => `${formatNumber(value, 2)} m`,
                [Potree.UtilityNetworkEditor.DimensionKind.AREA]: (value) => `${formatNumber(value, 1)} m²`,
                [Potree.UtilityNetworkEditor.DimensionKind.RADIUS]: (value) => `r = ${formatNumber(value, 2)} m`,
                [Potree.UtilityNetworkEditor.DimensionKind.HEIGHT]: (value) => `v = ${formatNumber(value, 2)} m`
            };
            return dimensionFormats[dimension.kind](dimension.value);
        }

        function startTerrainHeightSampler(pointCloud) {
            terrainHeightSampler = new Potree.UtilityNetworkEditor.TerrainHeightSampler(pointCloud);
            const terrainStatus = $("#utility_network_editor_terrain_status");
            dtmOverlay.setTerrainHeightSampler(terrainHeightSampler);
            cadastreOverlay.setTerrainHeightSampler(terrainHeightSampler);
            cadEditTool.setTerrainHeightSampler(terrainHeightSampler);
            terrainHeightSampler.addEventListener("ready", () => {
                terrainStatus.text("Výška terénu z mračna: hotovo.");
                scheduleFeatureViewRender();
            });
            terrainHeightSampler.addEventListener("failed", () => terrainStatus.text("Výšku terénu se nepodařilo spočítat."));
            terrainStatus.text("Výška terénu z mračna: počítám…");
            terrainHeightSampler.start();
        }

        function translateProfileWindow() {
            for (const [translationKey, text] of Object.entries(profileWindowTexts)) {
                $(`#profile_window [data-i18n="${translationKey}"]`).removeAttr("data-i18n").text(text);
            }
        }

        function disconnectPotreeMapView() {
            viewer.scene.removeEventListener("pointcloud_added", viewer.mapView.onPointcloudAdded);
        }

        function createEditorInterface() {
            $("#potree_sidebar_container").append(createEditorPanel());
            $("#potree_render_area").append(
                createToolbar(),
                createDrawingHint(),
                createSelectionCard(),
                createScenePrompt(),
                $("<div id=\"utility_network_editor_attribution\" class=\"editor-floating\"></div>")
            );
            updatePointCloudControls(Boolean(datasetName));
            for (const eventType of ["feature_added", "feature_removed", "layers_changed", "feature_layer_changed"]) {
                cadDocument.addEventListener(eventType, scheduleFeatureViewRender);
            }
            for (const eventType of ["feature_changed", "selection_changed"]) {
                cadEditTool.addEventListener(eventType, scheduleFeatureViewRender);
            }
            scheduleFeatureViewRender();
        }

        infoPanel.find(".utility-info-close").on("click", closeInfoPanel);
        dtmInfoTool.addEventListener("query_started", () => {
            isInfoPromptShown = false;
            showInfoMessage("Načítám informace o síti…");
        });
        dtmInfoTool.addEventListener("query_finished", (event) => showInfoResult(event.result));
        dtmInfoTool.addEventListener("query_failed", () => showInfoMessage("Dotaz na DTM se nezdařil."));
        cadTool.addEventListener("drawing_changed", updateEditToolAvailability);
        dtmInfoTool.addEventListener("activation_changed", updateEditToolAvailability);
        cadEditTool.addEventListener("feature_changed", () => cadHistory.capture());
        cadEditTool.addEventListener("selection_changed", () => cadHistory.capture());
        document.addEventListener("keydown", onUndoShortcut);

        const pointCloudLoaded = datasetName ? loadPointCloud(datasetName) : Promise.resolve(null);
        await viewer.loadGUI();
        disconnectPotreeMapView();
        viewer.setLanguage("cs");
        translateProfileWindow();
        viewer.toggleSidebar();
        createEditorInterface();
        restoreStoredDrawing();
        const pointCloud = await pointCloudLoaded;
        if (pointCloud) {
            replacePointCloud(pointCloud);
        } else if (datasetName) {
            updatePointCloudControls(false);
            showPointCloudStatus(`Mračno „${datasetName}“ se nepodařilo načíst ze složky examples/data. Otevřete vlastní LAS.`);
        } else {
            await restoreRecentPointCloud();
        }
    </script>
</body>
</html>
