<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="description" content="">
    <meta name="author" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Elevation profile</title>

    <link rel="stylesheet" type="text/css" href="../build/potree/potree.css">
    <link rel="stylesheet" type="text/css" href="../libs/jquery-ui/jquery-ui.min.css">
    <link rel="stylesheet" type="text/css" href="../libs/openlayers3/ol.css">
    <link rel="stylesheet" type="text/css" href="../libs/spectrum/spectrum.css">
    <link rel="stylesheet" type="text/css" href="../libs/jstree/themes/mixed/style.css">
    <script src="../libs/jquery/jquery-3.1.1.min.js"></script>
    <script src="../libs/spectrum/spectrum.js"></script>
    <script src="../libs/jquery-ui/jquery-ui.min.js"></script>
    <script src="../libs/other/BinaryHeap.js"></script>
    <script src="../libs/tween/tween.min.js"></script>
    <script src="../libs/d3/d3.js"></script>
    <script src="../libs/proj4/proj4.js"></script>
    <script src="../libs/openlayers3/ol.js"></script>
    <script src="../libs/i18next/i18next.js"></script>
    <script src="../libs/jstree/jstree.js"></script>
    <script src="../build/potree/potree.js"></script>
    <script src="../libs/plasio/js/laslaz.js"></script>
    <script type="module" defer>
        import * as THREE from "../libs/three.js/build/three.module.js";

        window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"),
                {
                    profileRenderArea: document.getElementById("potree_profile_render_area")
                });

        viewer.setEDLEnabled(true);
        viewer.setFOV(60);
        viewer.setPointBudget(1_000_000);
        viewer.loadSettingsFromURL();

        viewer.setDescription("Elevation profile control");

        viewer.loadGUI().then(() => {

            console.log("gui loaded task");

            viewer.setLanguage('en');
            $("#menu_tools").next().show();
            $("#menu_scene").next().show();
            viewer.toggleSidebar();

            const posX = document.getElementById("profile_info_pos_x");
            const posY = document.getElementById("profile_info_pos_y");
            const posZ = document.getElementById("profile_info_pos_z");
            viewer.profileControl.addEventListener("on_profile_point_changed", (data) => {
                const point = data.attributes["position"];
                posX.innerHTML = `X: ${point.x.toFixed(2)}`;
                posY.innerHTML = `Y: ${point.y.toFixed(2)}`;
                posZ.innerHTML = `Z: ${point.z.toFixed(2)}`;
            });
            viewer.profileControl.show();
            viewer.profileControlController.setProfile(viewer.scene.profiles[0]);
        });

        let profile = new Potree.Profile();
        profile.name = "Elevation Profile";
        profile.setWidth(6)
        profile.addMarker(new THREE.Vector3(589997.02, 231327.75, 755.73));
        profile.addMarker(new THREE.Vector3(589579.65, 231323.51, 775.78));
        profile.addMarker(new THREE.Vector3(589500.87, 231356.23, 782.91));

        viewer.scene.addProfile(profile);

        Potree.loadPointCloud("../pointclouds/vol_total/cloud.js", "sigeom.sa", function (e) {
            let scene = viewer.scene;
            scene.addPointCloud(e.pointcloud);

            let material = e.pointcloud.material;
            material.size = 1;
            material.pointSizeType = Potree.PointSizeType.ADAPTIVE;

            scene.view.position.set(589974.341, 231698.397, 986.146);
            scene.view.lookAt(new THREE.Vector3(589851.587, 231428.213, 715.634));
        });
    </script>
</head>

<body>
    <div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0; top: 0;">
        <div id="potree_sidebar_container"></div>
        <div id="potree_render_area"
             style="background-image: url('../build/potree/resources/images/background.jpg'); bottom: 0; left: 0; width: 100%; height: 70%"></div>
        <div id="potree_profile_render_area"
             style="position: absolute; background-color: #1a282d; bottom: 0; left: 300px; width: 100%; height: 30%">
        </div>
        <div id="profile_info_table"
             style="position: absolute;
                top: 70%;
                left: 300px;
                z-index: 2000;
                background: rgba(255, 255, 255, 0.8);
                color: #000;
                border-radius: 6px;
                padding: 6px 10px;
                margin: 6px;
                font-size: 14px;
                pointer-events: none;">
            <table style="border-collapse: collapse;">
                <tr>
                    <td id="profile_info_pos_x" style="padding: 2px 8px;"></td>
                </tr>
                <tr>
                    <td id="profile_info_pos_y" style="padding: 2px 8px;"></td>
                </tr>
                <tr>
                    <td id="profile_info_pos_z" style="padding: 2px 8px;"></td>
                </tr>
            </table>
        </div>
    </div>
</body>
</html>
